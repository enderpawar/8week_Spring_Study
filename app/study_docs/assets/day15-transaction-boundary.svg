<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 920" width="860" height="920" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="860" height="920" fill="#ffffff"/>
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
    <style>
      .msg { stroke: #334155; stroke-width: 1.3; fill: none; marker-end: url(#call); }
      .rtn { stroke: #334155; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; marker-end: url(#ret); }
      .act { fill: #ffffff; stroke: #334155; stroke-width: 1.1; }
      .life { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; }
      .code { font-size: 11.5px; fill: #334155; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .txt { font-size: 11.5px; fill: #475569; }
      .guard { font-size: 12px; font-weight: 600; fill: #0f172a; }
    </style>
  </defs>

  <text x="30" y="28" font-size="12" fill="#475569">시퀀스 다이어그램 — 트랜잭션 경계 안의 flush 이후 commit과 rollback이 갈리는 시점 (ReservationServiceTransactionTest)</text>

  <!-- participants -->
  <rect x="40" y="46" width="112" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="96" y="71" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">테스트</text>

  <rect x="216" y="46" width="168" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="300" y="64" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Service</text>
  <text x="300" y="79" class="code" text-anchor="middle">@Transactional</text>

  <rect x="444" y="46" width="192" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="540" y="71" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">영속성 컨텍스트</text>

  <rect x="714" y="46" width="112" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="770" y="71" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">H2</text>

  <!-- lifelines -->
  <line x1="96"  y1="86" x2="96"  y2="880" class="life"/>
  <line x1="300" y1="86" x2="300" y2="880" class="life"/>
  <line x1="540" y1="86" x2="540" y2="880" class="life"/>
  <line x1="770" y1="86" x2="770" y2="880" class="life"/>

  <!-- alt frame -->
  <rect x="56" y="104" width="784" height="764" fill="none" stroke="#334155" stroke-width="1.2"/>
  <path d="M 56 104 L 132 104 L 132 120 L 120 132 L 56 132 z" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="76" y="123" font-size="12" font-weight="600" fill="#0f172a">alt</text>
  <text x="148" y="124" class="guard">[정상 반환 — cancel(id, "일정 변경")]</text>

  <!-- ===== fragment 1: commit ===== -->
  <rect x="296" y="146" width="8" height="250" class="act"/>
  <rect x="536" y="172" width="8" height="80" class="act"/>
  <rect x="536" y="312" width="8" height="34" class="act"/>
  <rect x="766" y="196" width="8" height="32" class="act"/>
  <rect x="766" y="336" width="8" height="10" class="act"/>
  <rect x="766" y="362" width="8" height="10" class="act"/>
  <rect x="766" y="414" width="8" height="32" class="act"/>

  <line x1="96" y1="150" x2="294" y2="150" class="msg"/>
  <text x="195" y="144" class="code" text-anchor="middle">cancel(id, reason)</text>

  <line x1="304" y1="176" x2="534" y2="176" class="msg"/>
  <text x="419" y="170" class="code" text-anchor="middle">findById(id)</text>

  <line x1="544" y1="200" x2="764" y2="200" class="msg"/>
  <text x="654" y="194" class="code" text-anchor="middle">SELECT</text>

  <line x1="764" y1="224" x2="546" y2="224" class="rtn"/>
  <text x="655" y="218" class="txt" text-anchor="middle">행 1건 · 스냅샷 보관</text>

  <line x1="534" y1="248" x2="306" y2="248" class="rtn"/>
  <text x="420" y="242" class="txt" text-anchor="middle">영속 Reservation</text>

  <path d="M 304 268 H 344 V 290 H 306" class="msg"/>
  <text x="352" y="283" class="code">reservation.cancel(reason)</text>

  <line x1="304" y1="316" x2="534" y2="316" class="msg"/>
  <text x="419" y="310" class="txt" text-anchor="middle">정상 반환 → flush (변경 감지)</text>

  <line x1="544" y1="340" x2="764" y2="340" class="msg"/>
  <text x="654" y="334" class="code" text-anchor="middle">UPDATE</text>

  <line x1="304" y1="366" x2="764" y2="366" class="msg"/>
  <text x="654" y="360" class="code" text-anchor="middle" font-weight="700">COMMIT</text>

  <line x1="294" y1="392" x2="98" y2="392" class="rtn"/>
  <text x="195" y="386" class="txt" text-anchor="middle">반환</text>

  <line x1="96" y1="418" x2="764" y2="418" class="msg"/>
  <text x="195" y="412" class="txt" text-anchor="middle">재조회 (새 트랜잭션)</text>
  <text x="654" y="412" class="code" text-anchor="middle">SELECT</text>

  <line x1="764" y1="442" x2="98" y2="442" class="rtn"/>
  <text x="654" y="436" class="code" text-anchor="middle">confirmed=false, "일정 변경"</text>

  <!-- divider -->
  <line x1="56" y1="464" x2="840" y2="464" stroke="#334155" stroke-width="1.1" stroke-dasharray="6 4"/>
  <text x="148" y="486" class="guard">[RuntimeException — cancelThenFail(id)]</text>

  <!-- ===== fragment 2: rollback ===== -->
  <rect x="296" y="506" width="8" height="296" class="act"/>
  <rect x="536" y="532" width="8" height="80" class="act"/>
  <rect x="536" y="672" width="8" height="34" class="act"/>
  <rect x="766" y="556" width="8" height="32" class="act"/>
  <rect x="766" y="696" width="8" height="10" class="act"/>
  <rect x="766" y="772" width="8" height="10" class="act"/>
  <rect x="766" y="824" width="8" height="32" class="act"/>

  <line x1="96" y1="510" x2="294" y2="510" class="msg"/>
  <text x="195" y="504" class="code" text-anchor="middle">cancelThenFail(id)</text>

  <line x1="304" y1="536" x2="534" y2="536" class="msg"/>
  <text x="419" y="530" class="code" text-anchor="middle">findById(id)</text>

  <line x1="544" y1="560" x2="764" y2="560" class="msg"/>
  <text x="654" y="554" class="code" text-anchor="middle">SELECT</text>

  <line x1="764" y1="584" x2="546" y2="584" class="rtn"/>
  <text x="655" y="578" class="txt" text-anchor="middle">행 1건 · 스냅샷 보관</text>

  <line x1="534" y1="608" x2="306" y2="608" class="rtn"/>
  <text x="420" y="602" class="txt" text-anchor="middle">영속 Reservation</text>

  <path d="M 304 628 H 344 V 650 H 306" class="msg"/>
  <text x="352" y="643" class="code">reservation.cancel("강제 실패")</text>

  <line x1="304" y1="676" x2="534" y2="676" class="msg"/>
  <text x="419" y="670" class="code" text-anchor="middle">entityManager.flush()</text>

  <line x1="544" y1="700" x2="764" y2="700" class="msg"/>
  <text x="654" y="694" class="code" text-anchor="middle">UPDATE</text>

  <path d="M 304 724 H 344 V 746 H 306" class="msg"/>
  <text x="352" y="739" class="code">throw RuntimeException</text>

  <line x1="304" y1="776" x2="764" y2="776" class="msg"/>
  <text x="654" y="770" class="code" text-anchor="middle" font-weight="700">ROLLBACK</text>

  <line x1="294" y1="800" x2="98" y2="800" class="rtn"/>
  <text x="195" y="794" class="code" text-anchor="middle">RuntimeException</text>

  <line x1="96" y1="828" x2="764" y2="828" class="msg"/>
  <text x="195" y="822" class="txt" text-anchor="middle">재조회 (새 트랜잭션)</text>
  <text x="654" y="822" class="code" text-anchor="middle">SELECT</text>

  <line x1="764" y1="852" x2="98" y2="852" class="rtn"/>
  <text x="654" y="846" class="code" text-anchor="middle">confirmed=true, null</text>

  <!-- footnote -->
  <text x="30" y="904" font-size="12" fill="#475569">UPDATE는 두 경로 모두 DB로 전송된다. 최종 상태를 가르는 것은 flush가 아니라 뒤이은 COMMIT / ROLLBACK이다.</text>
</svg>
