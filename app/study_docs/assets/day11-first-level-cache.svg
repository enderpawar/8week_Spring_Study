  <line x1="96" y1="110" x2="284" y2="110" stroke="#334155" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="190" y="104" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">save(reservation)</text>

  <line x1="294" y1="140" x2="514" y2="140" stroke="#334155" stroke-width="1.3" marker-end="url(#call)"/>
