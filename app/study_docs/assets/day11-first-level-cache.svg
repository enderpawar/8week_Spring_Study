  <rect x="212" y="46" width="156" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="290" y="71" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Repository</text>

  <rect x="424" y="46" width="192" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="520" y="71" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">영속성 컨텍스트</text>

  <rect x="704" y="46" width="112" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="760" y="71" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">H2</text>

  <!-- lifelines -->
  <line x1="96"  y1="86" x2="96"  y2="704" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="290" y1="86" x2="290" y2="704" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="520" y1="86" x2="520" y2="704" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="760" y1="86" x2="760" y2="704" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- preamble activations -->
