  <rect x="286" y="358" width="8" height="34" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
  <rect x="516" y="292" width="8" height="20" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
