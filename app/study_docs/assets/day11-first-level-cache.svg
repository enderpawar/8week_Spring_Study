  <line x1="96" y1="282" x2="284" y2="282" stroke="#334155" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="190" y="276" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">findById(id)</text>

  <line x1="294" y1="302" x2="514" y2="302" stroke="#334155" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="404" y="296" font-size="11.5" fill="#475569" text-anchor="middle">캐시 조회</text>

  <line x1="514" y1="330" x2="296" y2="330" stroke="#334155" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ret)"/>
  <text x="405" y="324" font-size="11.5" fill="#475569" text-anchor="middle">인스턴스 r</text>

  <line x1="96" y1="362" x2="284" y2="362" stroke="#334155" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="190" y="356" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">findById(id)</text>

  <line x1="294" y1="382" x2="514" y2="382" stroke="#334155" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="404" y="376" font-size="11.5" fill="#475569" text-anchor="middle">캐시 조회</text>

  <line x1="514" y1="410" x2="296" y2="410" stroke="#334155" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ret)"/>
  <text x="405" y="404" font-size="11.5" fill="#475569" text-anchor="middle">인스턴스 r</text>

  <!-- divider -->
  <line x1="56" y1="436" x2="830" y2="436" stroke="#334155" stroke-width="1.1" stroke-dasharray="6 4"/>
  <text x="148" y="458" font-size="12" fill="#0f172a" font-weight="600">[clear() 호출]</text>

  <!-- fragment 2 activations -->
  <rect x="516" y="480" width="8" height="20" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
  <rect x="286" y="516" width="8" height="90" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
  <rect x="516" y="530" width="8" height="66" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
  <rect x="756" y="552" width="8" height="26" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
  <rect x="286" y="622" width="8" height="58" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
  <rect x="516" y="636" width="8" height="24" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>

  <line x1="96" y1="490" x2="514" y2="490" stroke="#334155" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="300" y="484" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">clear()</text>

  <line x1="96" y1="520" x2="284" y2="520" stroke="#334155" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="190" y="514" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">findById(id)</text>

  <line x1="294" y1="540" x2="514" y2="540" stroke="#334155" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="404" y="534" font-size="11.5" fill="#475569" text-anchor="middle">캐시 조회</text>

  <line x1="524" y1="562" x2="754" y2="562" stroke="#334155" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="639" y="556" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">SELECT</text>

  <line x1="754" y1="588" x2="526" y2="588" stroke="#334155" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ret)"/>
  <text x="640" y="582" font-size="11.5" fill="#475569" text-anchor="middle">행 1건</text>

  <line x1="96" y1="626" x2="284" y2="626" stroke="#334155" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="190" y="620" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">findById(id)</text>

  <line x1="294" y1="646" x2="514" y2="646" stroke="#334155" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="404" y="640" font-size="11.5" fill="#475569" text-anchor="middle">캐시 조회</text>

  <line x1="514" y1="674" x2="296" y2="674" stroke="#334155" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ret)"/>
  <text x="405" y="668" font-size="11.5" fill="#475569" text-anchor="middle">인스턴스 r</text>
