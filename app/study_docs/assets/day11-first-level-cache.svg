      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
  </defs>

  <text x="30" y="28" font-size="12" fill="#475569">시퀀스 다이어그램 — 한 트랜잭션 안에서 같은 id를 두 번 조회할 때 SQL이 나가는 시점</text>

  <!-- participants -->
  <rect x="40" y="46" width="112" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
