<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .grp { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .glabel { font-size: 13px; font-weight: 700; fill: #475569; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; }
      .ebox { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.4; }
      .t { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 11px; fill: #475569; }
      .m { font-size: 11px; fill: #334155; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .et { font-size: 13px; font-weight: 700; fill: #b91c1c; }
      .em { font-size: 11px; fill: #b91c1c; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .es { font-size: 11px; fill: #b91c1c; }
      .ln { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#a); }
      .er { stroke: #b91c1c; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#e); }
      .num { fill: #334155; }
      .numt { font-size: 11px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <text x="30" y="26" font-size="12" fill="#475569">전체 흐름 — POST /reservations의 입력 검증과 오류 응답 (Spring Boot 3.5)</text>

  <!-- Client -->
  <rect x="30" y="240" width="110" height="80" rx="10" class="box"/>
  <text x="85" y="272" text-anchor="middle" class="t">Client</text>
  <text x="85" y="290" text-anchor="middle" class="m">POST</text>
  <text x="85" y="305" text-anchor="middle" class="m">/reservations</text>

  <!-- 1 DispatcherServlet -->
  <rect x="165" y="235" width="110" height="90" rx="8" class="box"/>
  <circle cx="181" cy="251" r="9" class="num"/><text x="181" y="255" text-anchor="middle" class="numt">1</text>
  <text x="220" y="280" text-anchor="middle" class="t">Dispatcher</text>
  <text x="220" y="296" text-anchor="middle" class="t">Servlet</text>
  <text x="220" y="314" text-anchor="middle" class="s">요청 중계</text>
  <line x1="140" y1="280" x2="161" y2="280" class="ln"/>

  <!-- argument resolution group -->
  <rect x="288" y="195" width="319" height="145" rx="12" class="grp"/>
  <text x="300" y="216" class="glabel">인자 처리 · @RequestBody @Valid</text>

  <rect x="300" y="235" width="150" height="90" rx="8" class="box"/>
  <circle cx="316" cy="251" r="9" class="num"/><text x="316" y="255" text-anchor="middle" class="numt">2</text>
  <text x="375" y="280" text-anchor="middle" class="t">HttpMessage</text>
  <text x="375" y="296" text-anchor="middle" class="t">Converter</text>
  <text x="375" y="314" text-anchor="middle" class="m">→ ReservationRequest</text>

  <rect x="465" y="235" width="130" height="90" rx="8" class="box"/>
  <circle cx="481" cy="251" r="9" class="num"/><text x="481" y="255" text-anchor="middle" class="numt">3</text>
  <text x="530" y="280" text-anchor="middle" class="t">Bean</text>
  <text x="530" y="296" text-anchor="middle" class="t">Validation</text>
  <text x="530" y="314" text-anchor="middle" class="m">@NotBlank 검사</text>

  <line x1="275" y1="280" x2="296" y2="280" class="ln"/>
  <line x1="450" y1="280" x2="461" y2="280" class="ln"/>

  <!-- success branch -->
  <path d="M 595 260 H 625 V 125 H 641" class="ln"/>
  <text x="617" y="178" text-anchor="end" class="s">검증 통과</text>

  <rect x="645" y="85" width="130" height="80" rx="8" class="box"/>
  <circle cx="661" cy="101" r="9" class="num"/><text x="661" y="105" text-anchor="middle" class="numt">4</text>
  <text x="710" y="125" text-anchor="middle" class="t">Reservation</text>
  <text x="710" y="141" text-anchor="middle" class="t">Controller</text>
  <text x="710" y="157" text-anchor="middle" class="m">reserve()</text>

  <rect x="790" y="85" width="90" height="80" rx="8" class="box"/>
  <text x="835" y="120" text-anchor="middle" class="t">200 OK</text>
  <text x="835" y="140" text-anchor="middle" class="s">예약 완료</text>
  <text x="835" y="154" text-anchor="middle" class="s">문자열</text>
  <line x1="775" y1="125" x2="786" y2="125" class="ln"/>

  <path d="M 835 85 V 46 H 85 V 236" class="ln"/>

  <!-- failure branch -->
  <path d="M 595 300 H 720 V 380" class="er"/>
  <text x="730" y="326" class="em">MethodArgument</text>
  <text x="730" y="341" class="em">NotValidException</text>
  <text x="730" y="362" class="es">reserve() 본문 미실행</text>

  <rect x="640" y="384" width="160" height="84" rx="8" class="box"/>
  <circle cx="654" cy="398" r="9" class="num"/><text x="654" y="402" text-anchor="middle" class="numt">5</text>
  <text x="720" y="422" text-anchor="middle" class="t">ExceptionHandler</text>
  <text x="720" y="438" text-anchor="middle" class="t">ExceptionResolver</text>
  <text x="720" y="456" text-anchor="middle" class="s">DispatcherServlet이 위임</text>

  <rect x="405" y="356" width="210" height="122" rx="12" class="grp"/>
  <text x="417" y="374" class="glabel">@RestControllerAdvice</text>
  <rect x="420" y="384" width="180" height="84" rx="8" class="box"/>
  <circle cx="434" cy="398" r="9" class="num"/><text x="434" y="402" text-anchor="middle" class="numt">6</text>
  <text x="510" y="426" text-anchor="middle" class="t">GlobalExceptionHandler</text>
  <text x="510" y="448" text-anchor="middle" class="m">handleValidation()</text>

  <line x1="640" y1="426" x2="604" y2="426" class="er"/>

  <rect x="170" y="384" width="220" height="84" rx="8" class="ebox"/>
  <text x="280" y="412" text-anchor="middle" class="et">400 Bad Request</text>
  <text x="280" y="434" text-anchor="middle" class="em">{"roomName":</text>
  <text x="280" y="453" text-anchor="middle" class="es">"방 이름은 비어있을 수 없습니다"}</text>
  <line x1="420" y1="426" x2="394" y2="426" class="er"/>

  <path d="M 170 426 H 85 V 324" class="er"/>

  <!-- footnote -->
  <text x="30" y="530" font-size="12" fill="#475569">규칙은 DTO 필드(@NotBlank), 실행 지시는 파라미터(@Valid)에 있다. 응답 본문에는 실패한 필드만 담긴다.</text>
</svg>
