<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="900" height="690" fill="#ffffff"/>
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
    <style>
      .msg { stroke: #334155; stroke-width: 1.3; fill: none; marker-end: url(#call); }
      .rtn { stroke: #334155; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; marker-end: url(#ret); }
      .act { fill: #ffffff; stroke: #334155; stroke-width: 1.1; }
      .life { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; }
      .frame { fill: none; stroke: #334155; stroke-width: 1.2; }
      .tab { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .code { font-size: 11.5px; fill: #334155; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .txt { font-size: 11.5px; fill: #475569; }
      .guard { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .pname { font-size: 13px; font-weight: 600; fill: #0f172a; }
    </style>
  </defs>

  <text x="30" y="28" font-size="12" fill="#475569">시퀀스 다이어그램 — JdbcReservationRepository.findAll()의 자원 대여, 커서 이동, 역순 반납 (Day09)</text>

  <!-- participants: x = 110, 290, 450, 610, 790 -->
  <rect x="30" y="46" width="160" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="110" y="64" class="pname" text-anchor="middle">JdbcReservation</text>
  <text x="110" y="79" class="pname" text-anchor="middle">Repository</text>

  <rect x="225" y="46" width="130" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="290" y="64" class="pname" text-anchor="middle">DataSource</text>
  <text x="290" y="79" class="txt" text-anchor="middle">HikariCP 풀</text>

  <rect x="390" y="46" width="120" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="450" y="71" class="pname" text-anchor="middle">Connection</text>

  <rect x="540" y="46" width="140" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="610" y="71" class="pname" text-anchor="middle">PreparedStatement</text>

  <rect x="730" y="46" width="120" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="790" y="64" class="pname" text-anchor="middle">ResultSet</text>
  <text x="790" y="79" class="txt" text-anchor="middle">커서</text>

  <!-- lifelines -->
  <line x1="110" y1="86" x2="110" y2="660" class="life"/>
  <line x1="290" y1="86" x2="290" y2="660" class="life"/>
  <line x1="450" y1="86" x2="450" y2="660" class="life"/>
  <line x1="610" y1="86" x2="610" y2="660" class="life"/>
  <line x1="790" y1="86" x2="790" y2="660" class="life"/>

  <!-- activations -->
  <rect x="106" y="106" width="8" height="540" class="act"/>
  <rect x="286" y="116" width="8" height="28" class="act"/>
  <rect x="446" y="170" width="8" height="28" class="act"/>
  <rect x="606" y="224" width="8" height="28" class="act"/>

  <!-- acquire -->
  <line x1="114" y1="120" x2="284" y2="120" class="msg"/>
  <text x="199" y="114" class="code" text-anchor="middle">getConnection()</text>
  <line x1="284" y1="142" x2="116" y2="142" class="rtn"/>
  <text x="199" y="136" class="txt" text-anchor="middle">con (풀에서 대여)</text>

  <line x1="114" y1="174" x2="444" y2="174" class="msg"/>
  <text x="370" y="168" class="code" text-anchor="middle">prepareStatement(sql)</text>
  <line x1="444" y1="196" x2="116" y2="196" class="rtn"/>
  <text x="370" y="190" class="code" text-anchor="middle">ps</text>

  <line x1="114" y1="228" x2="604" y2="228" class="msg"/>
  <text x="530" y="222" class="code" text-anchor="middle">executeQuery()</text>
  <line x1="604" y1="250" x2="116" y2="250" class="rtn"/>
  <text x="530" y="244" class="txt" text-anchor="middle">rs — 첫 행 앞</text>

  <!-- loop frame -->
  <rect x="50" y="272" width="830" height="200" class="frame"/>
  <path d="M 50 272 L 116 272 L 116 288 L 104 300 L 50 300 z" class="tab"/>
  <text x="62" y="291" font-size="12" font-weight="600" fill="#0f172a">loop</text>
  <text x="130" y="292" class="guard">[rs.next() == true]</text>

  <rect x="786" y="312" width="8" height="28" class="act"/>
  <line x1="114" y1="316" x2="784" y2="316" class="msg"/>
  <text x="700" y="310" class="code" text-anchor="middle">next()</text>
  <line x1="784" y1="338" x2="116" y2="338" class="rtn"/>
  <text x="700" y="332" class="txt" text-anchor="middle">true — 다음 행으로 이동</text>

  <path d="M 114 358 H 154 V 380 H 122" class="msg"/>
  <text x="162" y="373" class="code">mapRow(rs)</text>
  <rect x="110" y="376" width="8" height="66" class="act"/>

  <rect x="786" y="404" width="8" height="28" class="act"/>
  <line x1="118" y1="408" x2="784" y2="408" class="msg"/>
  <text x="700" y="402" class="code" text-anchor="middle">getXxx("컬럼명")</text>
  <line x1="784" y1="430" x2="120" y2="430" class="rtn"/>
  <text x="700" y="424" class="txt" text-anchor="middle">현재 행의 값 (이동 없음)</text>

  <!-- loop exit -->
  <rect x="786" y="490" width="8" height="28" class="act"/>
  <line x1="114" y1="494" x2="784" y2="494" class="msg"/>
  <text x="700" y="488" class="code" text-anchor="middle">next()</text>
  <line x1="784" y1="516" x2="116" y2="516" class="rtn"/>
  <text x="700" y="510" class="txt" text-anchor="middle">false — 마지막 행 뒤</text>

  <!-- close in reverse order -->
  <line x1="114" y1="560" x2="784" y2="560" class="msg"/>
  <text x="700" y="554" class="code" text-anchor="middle">close()</text>

  <line x1="114" y1="590" x2="604" y2="590" class="msg"/>
  <text x="530" y="584" class="code" text-anchor="middle">close()</text>

  <line x1="114" y1="620" x2="444" y2="620" class="msg"/>
  <text x="370" y="614" class="code" text-anchor="middle">close() — 풀에 반납</text>

  <text x="30" y="680" font-size="12" fill="#475569">try-with-resources는 소괄호에서 연 자원을 연 순서의 역순으로 close()한다.</text>
</svg>
