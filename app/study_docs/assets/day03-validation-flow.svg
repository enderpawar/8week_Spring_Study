<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="820" height="600" fill="#ffffff"/>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="a3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="a3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="19" font-weight="700" fill="#0f172a">잘못된 요청이 400이 되기까지</text>
  <text x="40" y="54" font-size="13" fill="#64748b">타입 변환에 성공해도 값이 유효하다는 뜻은 아니다.</text>

  <rect x="40" y="78" width="360" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="102" font-size="15" font-weight="600" fill="#0f172a">POST /reservations</text>
  <text x="60" y="123" font-size="12" fill="#475569" font-family="ui-monospace, Consolas, monospace">{"roomName":"", "requesterName":"김민준"}</text>
  <line x1="220" y1="140" x2="220" y2="168" stroke="#64748b" stroke-width="1.8" marker-end="url(#a3)"/>

  <rect x="40" y="172" width="360" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="196" font-size="15" font-weight="600" fill="#0f172a">@RequestBody 변환 성공</text>
  <text x="60" y="216" font-size="12" fill="#475569">빈 문자열도 String 타입 조건은 만족한다</text>
  <line x1="220" y1="230" x2="220" y2="258" stroke="#64748b" stroke-width="1.8" marker-end="url(#a3)"/>

  <rect x="40" y="262" width="360" height="58" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="60" y="286" font-size="15" font-weight="600" fill="#0f172a">@Valid 가 @NotBlank 를 검사</text>
  <text x="60" y="306" font-size="12" fill="#475569">DTO에 붙여도 @Valid가 없으면 시작조차 안 한다</text>

  <!-- pass branch -->
  <line x1="400" y1="291" x2="470" y2="291" stroke="#22c55e" stroke-width="1.8" marker-end="url(#a3g)"/>
  <text x="406" y="283" font-size="12" fill="#16a34a">통과</text>
  <rect x="474" y="262" width="300" height="58" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="492" y="286" font-size="15" font-weight="600" fill="#0f172a">컨트롤러 본문 실행</text>
  <text x="492" y="306" font-size="12" fill="#475569" font-family="ui-monospace, Consolas, monospace">new Reservation(...) → confirm()</text>

  <!-- fail path -->
  <line x1="220" y1="320" x2="220" y2="348" stroke="#ef4444" stroke-width="1.8" marker-end="url(#a3r)"/>
  <text x="232" y="340" font-size="12" fill="#dc2626">실패 — 본문에 진입하지 않는다</text>

  <rect x="40" y="352" width="360" height="52" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="60" y="382" font-size="14" font-weight="600" fill="#0f172a">MethodArgumentNotValidException</text>
  <line x1="220" y1="404" x2="220" y2="432" stroke="#64748b" stroke-width="1.8" marker-end="url(#a3)"/>

  <rect x="40" y="436" width="360" height="66" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="60" y="460" font-size="14" font-weight="600" fill="#0f172a">ExceptionHandlerExceptionResolver</text>
  <text x="60" y="480" font-size="12" fill="#475569">@ControllerAdvice 계열을 전역 후보로 특별 취급</text>
  <text x="60" y="497" font-size="12" fill="#dc2626">Bean으로 등록만 된 @Service·@Component는 해당 없음</text>
  <line x1="220" y1="502" x2="220" y2="530" stroke="#64748b" stroke-width="1.8" marker-end="url(#a3)"/>

  <rect x="40" y="534" width="360" height="46" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="60" y="563" font-size="14" font-weight="600" fill="#0f172a">400 + 실패 필드 Map</text>

  <!-- getFieldErrors note -->
  <rect x="474" y="436" width="300" height="144" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="492" y="460" font-size="14" font-weight="600" fill="#0f172a">getFieldErrors()</text>
  <text x="492" y="482" font-size="12" fill="#475569">DTO의 모든 필드가 아니라</text>
  <text x="492" y="500" font-size="12" fill="#475569">검증에 실패해 FieldError가</text>
  <text x="492" y="518" font-size="12" fill="#475569">만들어진 필드만 반환한다</text>
  <text x="492" y="543" font-size="12" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">{"roomName":"방 이름은..."}</text>
  <text x="492" y="565" font-size="12" fill="#94a3b8">통과한 requesterName은 애초에</text>
  <text x="492" y="580" font-size="12" fill="#94a3b8">순회 대상이 아니다</text>
</svg>
