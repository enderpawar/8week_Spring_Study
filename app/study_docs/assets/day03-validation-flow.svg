<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="840" height="470" fill="#ffffff"/>
  <defs>
    <marker id="c3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="r3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
    <marker id="r3e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#b91c1c" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="20" y="18" width="120" height="34" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="80" y="40" font-size="12" fill="#0f172a" text-anchor="middle">:클라이언트</text>
  <rect x="180" y="18" width="170" height="34" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="265" y="40" font-size="12" fill="#0f172a" text-anchor="middle">:DispatcherServlet</text>
  <rect x="390" y="18" width="190" height="34" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="485" y="40" font-size="12" fill="#0f172a" text-anchor="middle">:ReservationController</text>
  <rect x="620" y="18" width="200" height="34" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="720" y="40" font-size="12" fill="#0f172a" text-anchor="middle">:GlobalExceptionHandler</text>

  <line x1="80" y1="52" x2="80" y2="450" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="265" y1="52" x2="265" y2="450" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="485" y1="52" x2="485" y2="450" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="720" y1="52" x2="720" y2="450" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="259" y="78" width="12" height="350" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>

  <line x1="80" y1="78" x2="253" y2="78" stroke="#334155" stroke-width="1.3" marker-end="url(#c3)"/>
  <text x="166" y="72" font-size="11" fill="#0f172a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">POST /reservations {"roomName":""}</text>

  <!-- self message -->
  <path d="M 271 100 L 330 100 L 330 128 L 277 128" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#c3)"/>
  <text x="340" y="106" font-size="11" fill="#0f172a">@RequestBody 변환 → @Valid 로 @NotBlank 검사</text>
  <text x="340" y="124" font-size="10.5" fill="#475569">타입 변환에 성공해도 값이 유효하다는 뜻은 아니다</text>

  <!-- alt frame -->
  <rect x="36" y="150" width="780" height="278" fill="none" stroke="#64748b" stroke-width="1.1"/>
  <path d="M 36 150 L 92 150 L 92 166 L 80 174 L 36 174 Z" fill="#f8fafc" stroke="#64748b" stroke-width="1.1"/>
  <text x="52" y="165" font-size="11" font-weight="600" fill="#0f172a">alt</text>
  <text x="102" y="165" font-size="11" fill="#0f172a">[검증 통과]</text>

  <line x1="271" y1="196" x2="479" y2="196" stroke="#334155" stroke-width="1.3" marker-end="url(#c3)"/>
  <text x="375" y="190" font-size="11" fill="#0f172a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">reserve(request)</text>
  <rect x="479" y="196" width="12" height="42" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>

  <line x1="479" y1="238" x2="277" y2="238" stroke="#334155" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#r3)"/>
  <text x="378" y="232" font-size="11" fill="#0f172a" text-anchor="middle">응답 문자열</text>

  <line x1="253" y1="268" x2="86" y2="268" stroke="#334155" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#r3)"/>
  <text x="170" y="262" font-size="11" fill="#0f172a" text-anchor="middle">200 OK</text>

  <line x1="36" y1="290" x2="816" y2="290" stroke="#64748b" stroke-width="1.1" stroke-dasharray="7 5"/>
  <text x="52" y="306" font-size="11" fill="#b91c1c">[검증 실패 — MethodArgumentNotValidException]</text>

  <line x1="271" y1="336" x2="714" y2="336" stroke="#334155" stroke-width="1.3" marker-end="url(#c3)"/>
  <text x="492" y="330" font-size="11" fill="#0f172a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">handleValidation(ex)</text>
  <rect x="714" y="336" width="12" height="40" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>

  <line x1="714" y1="376" x2="277" y2="376" stroke="#334155" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#r3)"/>
  <text x="496" y="370" font-size="11" fill="#0f172a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">400 + {"roomName": "..."}</text>

  <line x1="253" y1="406" x2="86" y2="406" stroke="#b91c1c" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#r3e)"/>
  <text x="170" y="400" font-size="11" fill="#b91c1c" text-anchor="middle">400 Bad Request</text>

  <text x="300" y="410" font-size="11" fill="#b91c1c">이 분기에서 :ReservationController 생명선은 한 번도 닿지 않는다</text>
</svg>
