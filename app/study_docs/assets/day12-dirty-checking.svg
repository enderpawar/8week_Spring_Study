<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="900" height="900" fill="#ffffff"/>
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
    <style>
      .msg { stroke: #334155; stroke-width: 1.3; fill: none; marker-end: url(#call); }
      .rtn { stroke: #334155; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; marker-end: url(#ret); }
      .act { fill: #ffffff; stroke: #334155; stroke-width: 1.1; }
      .life { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; }
      .frame { fill: none; stroke: #334155; stroke-width: 1.2; }
      .tab { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .code { font-size: 11.5px; fill: #334155; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .txt { font-size: 11.5px; fill: #475569; }
      .ftitle { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .warn { font-size: 12px; font-weight: 600; fill: #b91c1c; }
      .warncode { font-size: 11.5px; fill: #b91c1c; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
    </style>
  </defs>

  <text x="30" y="28" font-size="12" fill="#475569">시퀀스 다이어그램 — save() 없이 필드만 바꾼 Entity의 flush 시점 UPDATE 조건 (JpaReservationRepositoryTest)</text>

  <!-- participants -->
  <rect x="24" y="46" width="112" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="80" y="71" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">테스트</text>

  <rect x="190" y="46" width="130" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="255" y="71" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Repository</text>

  <rect x="360" y="46" width="150" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="435" y="71" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle" text-decoration="underline">r : Reservation</text>

  <rect x="545" y="46" width="170" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="630" y="71" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">영속성 컨텍스트</text>

  <rect x="760" y="46" width="100" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="810" y="71" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">H2</text>

  <!-- lifelines -->
  <line x1="80"  y1="86" x2="80"  y2="872" class="life"/>
  <line x1="255" y1="86" x2="255" y2="872" class="life"/>
  <line x1="435" y1="86" x2="435" y2="872" class="life"/>
  <line x1="630" y1="86" x2="630" y2="872" class="life"/>
  <line x1="810" y1="86" x2="810" y2="872" class="life"/>

  <!-- preamble: save + flush(INSERT) -->
  <rect x="251" y="112" width="8" height="42" class="act"/>
  <rect x="626" y="138" width="8" height="84" class="act"/>

  <line x1="80" y1="116" x2="249" y2="116" class="msg"/>
  <text x="165" y="110" class="code" text-anchor="middle">save(r)</text>

  <line x1="259" y1="146" x2="624" y2="146" class="msg"/>
  <text x="532" y="140" class="txt" text-anchor="middle">영속 상태로 등록</text>

  <line x1="80" y1="186" x2="624" y2="186" class="msg"/>
  <text x="165" y="180" class="code" text-anchor="middle">flush()</text>

  <line x1="634" y1="212" x2="804" y2="212" class="msg"/>
  <text x="719" y="206" class="code" text-anchor="middle">INSERT</text>

  <!-- findById: cache hit -->
  <rect x="251" y="248" width="8" height="78" class="act"/>
  <rect x="626" y="264" width="8" height="34" class="act"/>

  <line x1="80" y1="252" x2="249" y2="252" class="msg"/>
  <text x="165" y="246" class="code" text-anchor="middle">findById(id)</text>

  <line x1="259" y1="272" x2="624" y2="272" class="msg"/>
  <text x="532" y="266" class="txt" text-anchor="middle">캐시 조회</text>

  <line x1="624" y1="296" x2="261" y2="296" class="rtn"/>
  <text x="532" y="290" class="txt" text-anchor="middle">같은 인스턴스 r</text>

  <line x1="249" y1="322" x2="82" y2="322" class="rtn"/>
  <text x="165" y="316" class="code" text-anchor="middle">managed</text>

  <!-- alt frame -->
  <rect x="40" y="346" width="840" height="340" class="frame"/>
  <path d="M 40 346 L 106 346 L 106 362 L 94 374 L 40 374 z" class="tab"/>
  <text x="58" y="365" class="ftitle">alt</text>
  <text x="120" y="366" class="ftitle">[스냅샷 confirmed=true : 저장 전 confirm() — 3차 시도]</text>

  <!-- fragment 1 -->
  <line x1="80" y1="400" x2="429" y2="400" class="msg"/>
  <text x="345" y="394" class="code" text-anchor="middle">managed.cancel()</text>
  <rect x="431" y="396" width="8" height="26" class="act"/>
  <text x="447" y="414" class="code">confirmed = false</text>

  <rect x="626" y="438" width="8" height="84" class="act"/>
  <line x1="80" y1="442" x2="624" y2="442" class="msg"/>
  <text x="165" y="436" class="code" text-anchor="middle">flush()</text>

  <path d="M 634 456 H 668 V 476 H 636" class="msg"/>
  <text x="674" y="471" class="code">true ≠ false</text>

  <line x1="634" y1="508" x2="804" y2="508" class="msg"/>
  <text x="719" y="502" class="code" text-anchor="middle">UPDATE</text>

  <!-- divider -->
  <line x1="40" y1="540" x2="880" y2="540" stroke="#334155" stroke-width="1.1" stroke-dasharray="6 4"/>
  <text x="120" y="562" class="warn">[스냅샷 confirmed=false : 1차 cancel()만 / 2차 조회 후 confirm()→cancel()]</text>

  <!-- fragment 2 -->
  <line x1="80" y1="592" x2="429" y2="592" class="msg"/>
  <text x="345" y="586" class="code" text-anchor="middle">cancel()</text>
  <rect x="431" y="588" width="8" height="26" class="act"/>
  <text x="447" y="606" class="code">confirmed = false</text>

  <rect x="626" y="630" width="8" height="44" class="act"/>
  <line x1="80" y1="634" x2="624" y2="634" class="msg"/>
  <text x="165" y="628" class="code" text-anchor="middle">flush()</text>

  <path d="M 634 646 H 668 V 666 H 636" class="msg"/>
  <text x="674" y="661" class="warncode">false = false → UPDATE 없음</text>

  <!-- reload -->
  <rect x="626" y="706" width="8" height="18" class="act"/>
  <line x1="80" y1="714" x2="624" y2="714" class="msg"/>
  <text x="165" y="708" class="code" text-anchor="middle">clear()</text>

  <rect x="251" y="742" width="8" height="96" class="act"/>
  <rect x="626" y="760" width="8" height="58" class="act"/>
  <rect x="806" y="778" width="8" height="24" class="act"/>

  <line x1="80" y1="746" x2="249" y2="746" class="msg"/>
  <text x="165" y="740" class="code" text-anchor="middle">findById(id)</text>

  <line x1="259" y1="766" x2="624" y2="766" class="msg"/>
  <text x="532" y="760" class="txt" text-anchor="middle">캐시 조회 (비어 있음)</text>

  <line x1="634" y1="784" x2="804" y2="784" class="msg"/>
  <text x="719" y="778" class="code" text-anchor="middle">SELECT</text>

  <line x1="804" y1="802" x2="636" y2="802" class="rtn"/>
  <text x="719" y="796" class="code" text-anchor="middle">confirmed=false</text>

  <line x1="624" y1="818" x2="261" y2="818" class="rtn"/>
  <text x="532" y="812" class="txt" text-anchor="middle">새 인스턴스</text>

  <line x1="249" y1="836" x2="82" y2="836" class="rtn"/>
  <text x="165" y="830" class="code" text-anchor="middle">reloaded</text>

  <!-- footnote -->
  <text x="30" y="890" font-size="12" fill="#475569">두 갈래 모두 assertFalse(reloaded.isConfirmed())는 통과한다. 차이는 UPDATE가 나갔는지뿐이다.</text>
</svg>
