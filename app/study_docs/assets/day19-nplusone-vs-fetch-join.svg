<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 650" width="860" height="650" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="860" height="650" fill="#ffffff"/>
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
    <marker id="callHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .msg { stroke: #334155; stroke-width: 1.3; fill: none; marker-end: url(#call); }
      .rtn { stroke: #334155; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; marker-end: url(#ret); }
      .hi { stroke: #b91c1c; stroke-width: 1.3; fill: none; marker-end: url(#callHi); }
      .act { fill: #ffffff; stroke: #334155; stroke-width: 1.1; }
      .life { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; }
      .frame { fill: none; stroke: #334155; stroke-width: 1.2; }
      .tab { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .code { font-size: 11.5px; fill: #334155; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .codeHi { font-size: 11.5px; fill: #b91c1c; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .txt { font-size: 11.5px; fill: #475569; }
      .result { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .resultHi { font-size: 12px; font-weight: 700; fill: #b91c1c; }
      .ftitle { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .pname { font-size: 12.5px; font-weight: 600; fill: #0f172a; }
    </style>
  </defs>

  <text x="20" y="24" font-size="12" fill="#475569">시퀀스 다이어그램 — Reservation 3건 목록 조회 후 member 이름 순회 (NPlusOneTest)</text>

  <!-- participants -->
  <rect x="25" y="38" width="90" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="70" y="63" class="pname" text-anchor="middle">테스트</text>

  <rect x="150" y="38" width="200" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="250" y="63" class="pname" text-anchor="middle">ReservationRepository</text>

  <rect x="385" y="38" width="190" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="480" y="55" class="pname" text-anchor="middle">Reservation.member</text>
  <text x="480" y="71" class="txt" text-anchor="middle">(LAZY 연관 필드)</text>

  <rect x="690" y="38" width="100" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="740" y="63" class="pname" text-anchor="middle">DB</text>

  <!-- lifelines -->
  <line x1="70"  y1="78" x2="70"  y2="632" class="life"/>
  <line x1="250" y1="78" x2="250" y2="632" class="life"/>
  <line x1="480" y1="78" x2="480" y2="632" class="life"/>
  <line x1="740" y1="78" x2="740" y2="632" class="life"/>

  <!-- ===== Frame A: findAll() ===== -->
  <rect x="20" y="96" width="820" height="252" class="frame"/>
  <path d="M 20 96 L 250 96 L 250 110 L 238 122 L 20 122 z" class="tab"/>
  <text x="30" y="114" class="ftitle">findAll() — FetchType.LAZY 그대로</text>

  <rect x="246" y="136" width="8" height="76" class="act"/>
  <line x1="70" y1="140" x2="244" y2="140" class="msg"/>
  <text x="157" y="134" class="code" text-anchor="middle">findAll()</text>

  <rect x="736" y="156" width="8" height="28" class="act"/>
  <line x1="254" y1="160" x2="734" y2="160" class="msg"/>
  <text x="612" y="154" class="code" text-anchor="middle">select … from reservation</text>

  <line x1="736" y1="182" x2="256" y2="182" class="rtn"/>
  <text x="612" y="176" class="txt" text-anchor="middle">3행 (member_id 값 포함)</text>

  <line x1="246" y1="204" x2="72" y2="204" class="rtn"/>
  <text x="157" y="198" class="code" text-anchor="middle">List&lt;Reservation&gt;</text>
  <text x="157" y="222" class="txt" text-anchor="middle">member = 미초기화 Proxy ×3</text>

  <rect x="40" y="234" width="790" height="84" class="frame"/>
  <path d="M 40 234 L 130 234 L 130 244 L 122 252 L 40 252 z" class="tab"/>
  <text x="48" y="247" class="ftitle">loop [3건]</text>

  <rect x="476" y="262" width="8" height="44" class="act"/>
  <line x1="70" y1="266" x2="474" y2="266" class="hi"/>
  <text x="300" y="260" class="code" text-anchor="middle">getMember().getName()</text>

  <rect x="736" y="278" width="8" height="12" class="act"/>
  <line x1="484" y1="282" x2="734" y2="282" class="hi"/>
  <text x="612" y="276" class="codeHi" text-anchor="middle">select … from member where id=?</text>

  <line x1="476" y1="302" x2="72" y2="302" class="rtn"/>
  <text x="300" y="296" class="code" text-anchor="middle">"진우" / "철수" / "영희"</text>

  <text x="30" y="338" class="resultHi">findAll() 구간 member SELECT 0번 · 순회 구간 3번 → 총 SQL 1 + 3 = 4번</text>

  <!-- ===== Frame B: findAllWithMember() ===== -->
  <rect x="20" y="368" width="820" height="252" class="frame"/>
  <path d="M 20 368 L 290 368 L 290 382 L 278 394 L 20 394 z" class="tab"/>
  <text x="30" y="386" class="ftitle">findAllWithMember() — join fetch</text>

  <rect x="246" y="408" width="8" height="76" class="act"/>
  <line x1="70" y1="412" x2="244" y2="412" class="msg"/>
  <text x="157" y="406" class="code" text-anchor="middle">findAllWithMember()</text>

  <rect x="736" y="428" width="8" height="28" class="act"/>
  <line x1="254" y1="432" x2="734" y2="432" class="msg"/>
  <text x="612" y="426" class="code" text-anchor="middle">select … join member</text>

  <line x1="736" y1="454" x2="256" y2="454" class="rtn"/>
  <text x="612" y="448" class="txt" text-anchor="middle">3행 (member 컬럼 포함)</text>

  <line x1="246" y1="476" x2="72" y2="476" class="rtn"/>
  <text x="157" y="470" class="code" text-anchor="middle">List&lt;Reservation&gt;</text>
  <text x="157" y="494" class="txt" text-anchor="middle">member = 초기화 완료</text>

  <rect x="40" y="506" width="790" height="84" class="frame"/>
  <path d="M 40 506 L 130 506 L 130 516 L 122 524 L 40 524 z" class="tab"/>
  <text x="48" y="519" class="ftitle">loop [3건]</text>

  <rect x="476" y="534" width="8" height="30" class="act"/>
  <line x1="70" y1="538" x2="474" y2="538" class="msg"/>
  <text x="300" y="532" class="code" text-anchor="middle">getMember().getName()</text>

  <line x1="476" y1="560" x2="72" y2="560" class="rtn"/>
  <text x="300" y="554" class="code" text-anchor="middle">"진우" / "철수" / "영희"</text>

  <text x="30" y="610" class="result">호출 구간 JOIN SQL 1번 · 순회 구간 0번 → 총 SQL 1번</text>
</svg>
