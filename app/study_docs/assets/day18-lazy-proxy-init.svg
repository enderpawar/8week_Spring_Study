<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="1100" height="560" fill="#ffffff"/>
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
    <marker id="callHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .msg { stroke: #334155; stroke-width: 1.3; fill: none; marker-end: url(#call); }
      .rtn { stroke: #334155; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; marker-end: url(#ret); }
      .hi { stroke: #b91c1c; stroke-width: 1.3; fill: none; marker-end: url(#callHi); }
      .act { fill: #ffffff; stroke: #334155; stroke-width: 1.1; }
      .life { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; }
      .frame { fill: none; stroke: #334155; stroke-width: 1.2; }
      .tab { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .code { font-size: 11.5px; fill: #334155; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .txt { font-size: 11.5px; fill: #475569; }
      .txtHi { font-size: 11.5px; fill: #b91c1c; font-weight: 600; }
      .result { font-size: 12px; font-weight: 700; fill: #0f172a; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .ftitle { font-size: 12px; font-weight: 600; fill: #0f172a; }
    </style>
  </defs>

  <text x="30" y="28" font-size="12" fill="#475569">시퀀스 다이어그램 — Reservation.member의 LAZY 초기화 시점 (MemberLazyProxyTest)</text>

  <!-- participants -->
  <rect x="34" y="46" width="110" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="89" y="71" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">테스트</text>

  <rect x="230" y="46" width="230" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="345" y="71" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">ReservationRepository</text>

  <rect x="620" y="46" width="220" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="730" y="64" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Reservation.member</text>
  <text x="730" y="79" class="code" text-anchor="middle">(Member$HibernateProxy)</text>

  <!-- lifelines -->
  <line x1="89"  y1="86" x2="89"  y2="512" class="life"/>
  <line x1="345" y1="86" x2="345" y2="512" class="life"/>
  <line x1="730" y1="86" x2="730" y2="512" class="life"/>

  <rect x="46" y="102" width="1008" height="392" class="frame"/>
  <path d="M 46 102 L 320 102 L 320 118 L 308 130 L 46 130 z" class="tab"/>
  <text x="58" y="121" class="ftitle">entityManager.clear() 이후 재조회</text>

  <rect x="341" y="146" width="8" height="86" class="act"/>

  <line x1="89" y1="150" x2="339" y2="150" class="msg"/>
  <text x="214" y="144" class="code" text-anchor="middle">findById(id)</text>

  <path d="M 349 168 H 389 V 190 H 351" class="msg"/>
  <text x="397" y="183" class="code">select r1_0.* from reservation r1_0</text>
  <text x="397" y="197" class="code">where r1_0.id=? <tspan class="txt">(member_id 컬럼값 포함)</tspan></text>

  <line x1="339" y1="222" x2="91" y2="222" class="rtn"/>
  <text x="214" y="216" class="code" text-anchor="middle">Reservation</text>
  <text x="214" y="238" class="txt" text-anchor="middle">member 필드 = 아직 초기화 안 된 프록시</text>

  <rect x="726" y="266" width="8" height="46" class="act"/>
  <line x1="89" y1="270" x2="724" y2="270" class="msg"/>
  <text x="409" y="264" class="code" text-anchor="middle">getMember().getClass()</text>

  <line x1="724" y1="298" x2="91" y2="298" class="rtn"/>
  <text x="409" y="292" class="code" text-anchor="middle">Member$HibernateProxy</text>
  <text x="409" y="316" class="result" text-anchor="middle">이 시점까지 member 테이블 SELECT 없음</text>

  <rect x="726" y="352" width="8" height="112" class="act"/>
  <line x1="89" y1="356" x2="724" y2="356" class="hi"/>
  <text x="409" y="350" class="code" text-anchor="middle">getMember().getName()</text>

  <path d="M 734 374 H 784 V 396 H 736" class="hi"/>
  <text x="792" y="382" class="code">select m1_0.* from member m1_0</text>
  <text x="792" y="396" class="txtHi">where m1_0.id=? → 초기화</text>

  <line x1="724" y1="440" x2="91" y2="440" class="rtn"/>
  <text x="409" y="434" class="code" text-anchor="middle">"진우"</text>

  <text x="58" y="472" class="result">결과 — getClass()는 SELECT 없이 즉시 반환, getName()에서만 member SELECT 발생</text>

  <text x="30" y="536" font-size="12" fill="#475569">getMember() 호출 자체는 초기화를 일으키지 않는다. 프록시에서 실제 값(getName())을 꺼내는 순간에만 SELECT가 지연 실행된다.</text>
</svg>
