<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .grp { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .glabel { font-size: 13px; font-weight: 700; fill: #475569; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; }
      .t { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 11px; fill: #475569; }
      .m { font-size: 11px; fill: #334155; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .ln { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#a); }
      .er { stroke: #b91c1c; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#e); }
      .num { fill: #334155; }
      .numt { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .et { font-size: 11px; fill: #b91c1c; }
      .em { font-size: 11px; fill: #b91c1c; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
    </style>
  </defs>

  <text x="20" y="28" font-size="12" fill="#475569">전체 흐름 — 애플리케이션 시작부터 요청 처리까지 (Spring Boot 3.5 · 기본 singleton scope)</text>

  <!-- 1 app start -->
  <rect x="20" y="84" width="170" height="62" rx="8" class="box"/>
  <circle cx="36" cy="100" r="9" class="num"/><text x="36" y="104" text-anchor="middle" class="numt">1</text>
  <text x="52" y="105" class="t">애플리케이션 시작</text>
  <text x="105" y="131" text-anchor="middle" class="m">SpringApplication.run()</text>

  <!-- ApplicationContext group -->
  <rect x="210" y="48" width="670" height="302" rx="12" class="grp"/>
  <text x="226" y="70" class="glabel">ApplicationContext 기동</text>

  <rect x="228" y="84" width="300" height="62" rx="8" class="box"/>
  <circle cx="248" cy="104" r="9" class="num"/><text x="248" y="108" text-anchor="middle" class="numt">2</text>
  <text x="264" y="109" class="t">Component Scan</text>
  <text x="264" y="131" class="s">@Repository · @Service · @RestController 수집</text>

  <rect x="558" y="84" width="300" height="62" rx="8" class="box"/>
  <circle cx="578" cy="104" r="9" class="num"/><text x="578" y="108" text-anchor="middle" class="numt">3</text>
  <text x="594" y="109" class="t">Bean 정의 등록</text>
  <text x="594" y="131" class="s">Bean 이름 · 타입 · 생성자 인자 확정</text>

  <line x1="190" y1="115" x2="224" y2="115" class="ln"/>
  <line x1="528" y1="115" x2="554" y2="115" class="ln"/>
  <path d="M 708 146 V 166 H 323 V 182" class="ln"/>

  <!-- creation row -->
  <rect x="228" y="186" width="190" height="82" rx="8" class="box"/>
  <circle cx="244" cy="202" r="9" class="num"/><text x="244" y="206" text-anchor="middle" class="numt">4</text>
  <text x="323" y="224" text-anchor="middle" class="t">InMemory</text>
  <text x="323" y="240" text-anchor="middle" class="t">ReservationRepository</text>
  <text x="323" y="258" text-anchor="middle" class="m">@Repository</text>

  <rect x="448" y="186" width="190" height="82" rx="8" class="box"/>
  <circle cx="464" cy="202" r="9" class="num"/><text x="464" y="206" text-anchor="middle" class="numt">5</text>
  <text x="543" y="232" text-anchor="middle" class="t">ReservationService</text>
  <text x="543" y="258" text-anchor="middle" class="m">(ReservationRepository)</text>

  <rect x="668" y="186" width="190" height="82" rx="8" class="box"/>
  <circle cx="684" cy="202" r="9" class="num"/><text x="684" y="206" text-anchor="middle" class="numt">6</text>
  <text x="763" y="232" text-anchor="middle" class="t">ReservationController</text>
  <text x="763" y="258" text-anchor="middle" class="m">(ReservationService)</text>

  <line x1="418" y1="227" x2="444" y2="227" class="ln"/>
  <text x="433" y="219" text-anchor="middle" class="s">주입</text>
  <line x1="638" y1="227" x2="664" y2="227" class="ln"/>
  <text x="653" y="219" text-anchor="middle" class="s">주입</text>

  <!-- singleton store -->
  <line x1="323" y1="268" x2="323" y2="286" class="ln"/>
  <line x1="543" y1="268" x2="543" y2="286" class="ln"/>
  <line x1="763" y1="268" x2="763" y2="286" class="ln"/>
  <rect x="228" y="290" width="630" height="46" rx="8" class="box"/>
  <circle cx="248" cy="313" r="9" class="num"/><text x="248" y="317" text-anchor="middle" class="numt">7</text>
  <text x="264" y="318" class="t">Singleton Bean 보관</text>
  <text x="420" y="318" class="m">getBean(ReservationService.class) ×2 → assertSame 통과</text>

  <!-- error path -->
  <line x1="228" y1="227" x2="194" y2="227" class="er"/>
  <rect x="20" y="190" width="170" height="80" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="105" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">기동 실패</text>
  <text x="105" y="232" text-anchor="middle" class="em">NoSuchBean-</text>
  <text x="105" y="246" text-anchor="middle" class="em">DefinitionException</text>
  <text x="105" y="262" text-anchor="middle" class="et">@Repository 제거 시</text>

  <!-- request group -->
  <rect x="20" y="380" width="860" height="122" rx="12" class="grp"/>
  <circle cx="44" cy="398" r="9" class="num"/><text x="44" y="402" text-anchor="middle" class="numt">8</text>
  <text x="60" y="403" class="glabel">요청 처리 — 보관된 Bean 재사용</text>

  <path d="M 415 336 V 410" class="ln"/>
  <text x="423" y="366" class="s">같은 인스턴스</text>

  <rect x="30" y="414" width="138" height="72" rx="8" class="box"/>
  <text x="99" y="446" text-anchor="middle" class="t">Client</text>
  <text x="99" y="466" text-anchor="middle" class="m">POST /reservations</text>

  <rect x="184" y="414" width="142" height="72" rx="8" class="box"/>
  <text x="255" y="446" text-anchor="middle" class="t">DispatcherServlet</text>
  <text x="255" y="466" text-anchor="middle" class="s">요청 중계</text>

  <rect x="340" y="414" width="150" height="72" rx="8" class="box"/>
  <text x="415" y="438" text-anchor="middle" class="t">Reservation</text>
  <text x="415" y="454" text-anchor="middle" class="t">Controller</text>
  <text x="415" y="474" text-anchor="middle" class="m">reserve(request)</text>

  <rect x="510" y="414" width="150" height="72" rx="8" class="box"/>
  <text x="585" y="438" text-anchor="middle" class="t">Reservation</text>
  <text x="585" y="454" text-anchor="middle" class="t">Service</text>
  <text x="585" y="474" text-anchor="middle" class="m">reserve(...)</text>

  <rect x="680" y="414" width="180" height="72" rx="8" class="box"/>
  <text x="770" y="438" text-anchor="middle" class="t">InMemory</text>
  <text x="770" y="454" text-anchor="middle" class="t">ReservationRepository</text>
  <text x="770" y="474" text-anchor="middle" class="m">save(reservation)</text>

  <line x1="168" y1="450" x2="180" y2="450" class="ln"/>
  <line x1="326" y1="450" x2="336" y2="450" class="ln"/>
  <line x1="490" y1="450" x2="506" y2="450" class="ln"/>
  <line x1="660" y1="450" x2="676" y2="450" class="ln"/>

  <!-- footnote -->
  <text x="20" y="538" font-size="12" fill="#475569">생성 순서는 ④→⑤→⑥(Repository → Service → Controller)이고, 요청의 호출 순서는 그 반대 방향이다.</text>
</svg>
