<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="840" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="a4r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="19" font-weight="700" fill="#0f172a">같은 값으로 새 객체를 만들면 왜 기존 예약을 못 바꾸나</text>
  <text x="40" y="54" font-size="13" fill="#64748b">값이 같아 보이는 것과 같은 객체인 것은 다르다.</text>

  <!-- LEFT: before -->
  <rect x="30" y="76" width="380" height="238" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="50" y="102" font-size="15" font-weight="700" fill="#b91c1c">처음 구현 — 이름으로 취소</text>
  <text x="50" y="124" font-size="12" fill="#475569" font-family="ui-monospace, Consolas, monospace">cancel("301호", "김민준")</text>
  <text x="50" y="146" font-size="12" fill="#475569" font-family="ui-monospace, Consolas, monospace">→ new Reservation(...)  // 새 객체</text>

  <rect x="50" y="162" width="150" height="60" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="64" y="182" font-size="12" font-weight="600" fill="#0f172a">저장돼 있던 객체</text>
  <text x="64" y="200" font-size="12" fill="#475569">301호 · 김민준</text>
  <text x="64" y="216" font-size="12" fill="#16a34a">confirmed = true</text>

  <rect x="230" y="162" width="150" height="60" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.3"/>
  <text x="244" y="182" font-size="12" font-weight="600" fill="#0f172a">새로 만든 객체</text>
  <text x="244" y="200" font-size="12" fill="#475569">301호 · 김민준</text>
  <text x="244" y="216" font-size="12" fill="#dc2626">confirmed = false</text>

  <text x="50" y="248" font-size="12" fill="#b91c1c">값은 같지만 서로 다른 인스턴스다.</text>
  <text x="50" y="268" font-size="12" fill="#b91c1c">기존 예약은 그대로고 저장소에 하나가 더 생겼다.</text>
  <text x="50" y="294" font-size="12" fill="#475569">이름 조합은 중복될 수도 있어 하나를 특정하지 못한다.</text>

  <!-- RIGHT: after -->
  <rect x="430" y="76" width="380" height="238" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="450" y="102" font-size="15" font-weight="700" fill="#15803d">고친 구현 — 식별자로 취소</text>
  <text x="450" y="124" font-size="12" fill="#475569" font-family="ui-monospace, Consolas, monospace">POST /reservations/cancel/{id}</text>
  <text x="450" y="146" font-size="12" fill="#475569" font-family="ui-monospace, Consolas, monospace">→ findById(1L) → 그 객체의 cancel()</text>

  <rect x="450" y="162" width="180" height="60" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.3"/>
  <text x="464" y="182" font-size="12" font-weight="600" fill="#0f172a">저장돼 있던 바로 그 객체</text>
  <text x="464" y="200" font-size="12" fill="#475569">id = 1 · 301호 · 김민준</text>
  <text x="464" y="216" font-size="12" fill="#dc2626">confirmed = false 로 변경</text>

  <text x="450" y="248" font-size="12" fill="#15803d">id가 "이게 바로 그 예약"이라고 지목한다.</text>
  <text x="450" y="268" font-size="12" fill="#475569">DB의 기본키가 한 행을 유일하게 가리키는 것과 같은 목적.</text>
  <text x="450" y="294" font-size="12" fill="#475569">조회는 .equals() — 값 비교. ==는 참조 비교다.</text>

  <!-- BOTTOM: remaining defect -->
  <rect x="30" y="336" width="780" height="196" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="50" y="362" font-size="15" font-weight="700" fill="#b45309">아직 남은 결함 — save()가 갱신을 모른다</text>

  <text x="50" y="388" font-size="12" fill="#475569" font-family="ui-monospace, Consolas, monospace">findById(1L) → reservation.cancel() → save(reservation)</text>
  <text x="50" y="408" font-size="12" fill="#475569">리스트에는 복사본이 아니라 <tspan font-weight="600" fill="#0f172a">참조</tspan>가 들어 있어서, cancel() 시점에 이미 바뀌어 있다.</text>
  <text x="50" y="428" font-size="12" fill="#475569">그런데 save()는 ID 유무와 관계없이 <tspan font-family="ui-monospace, Consolas, monospace" fill="#b91c1c">store.add(reservation)</tspan> 을 그냥 실행한다.</text>

  <rect x="50" y="444" width="330" height="66" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="64" y="466" font-size="12" font-weight="600" fill="#0f172a">store (ArrayList)</text>
  <text x="64" y="486" font-size="12" fill="#475569">[0] ──┐</text>
  <text x="64" y="502" font-size="12" fill="#475569">[1] ──┴─→ 같은 Reservation 객체 하나</text>

  <text x="404" y="466" font-size="12" fill="#b45309">원소 수는 늘지만 가리키는 대상은 하나다.</text>
  <text x="404" y="486" font-size="12" fill="#475569">Day4에는 findAll() 엔드포인트도 원소 수를 세는</text>
  <text x="404" y="502" font-size="12" fill="#475569">테스트도 없어서 실제 중복 여부는 <tspan font-weight="600" fill="#b45309">미검증</tspan>이다.</text>
</svg>
