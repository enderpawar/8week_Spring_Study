<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="860" height="540" fill="#ffffff"/>

  <text x="30" y="30" font-size="12" fill="#475569">객체 다이어그램 — 실행 중 한 시점의 인스턴스와 링크</text>

  <!-- ================= 상단: 식별자가 없을 때 ================= -->
  <text x="30" y="62" font-size="12.5" font-weight="600" fill="#0f172a">이름으로 취소했을 때 — 서로 다른 인스턴스가 둘</text>

  <rect x="30" y="78" width="210" height="52" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="135" y="100" font-size="12" fill="#0f172a" text-anchor="middle" text-decoration="underline">store : ArrayList</text>
  <text x="135" y="119" font-size="11" fill="#475569" text-anchor="middle">size = 2</text>

  <line x1="240" y1="96" x2="380" y2="96" stroke="#334155" stroke-width="1.2"/>
  <text x="300" y="90" font-size="10.5" fill="#475569" text-anchor="middle">[0]</text>
  <line x1="240" y1="112" x2="380" y2="196" stroke="#334155" stroke-width="1.2"/>
  <text x="300" y="164" font-size="10.5" fill="#475569" text-anchor="middle">[1]</text>

  <rect x="380" y="70" width="250" height="76" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="505" y="90" font-size="12" fill="#0f172a" text-anchor="middle" text-decoration="underline">r1 : Reservation</text>
  <line x1="380" y1="98" x2="630" y2="98" stroke="#334155" stroke-width="1.1"/>
  <text x="392" y="116" font-size="11" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">roomName = "301호"</text>
  <text x="392" y="134" font-size="11" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">confirmed = true</text>

  <rect x="380" y="170" width="250" height="76" fill="#ffffff" stroke="#b91c1c" stroke-width="1.3"/>
  <text x="505" y="190" font-size="12" fill="#0f172a" text-anchor="middle" text-decoration="underline">r2 : Reservation</text>
  <line x1="380" y1="198" x2="630" y2="198" stroke="#b91c1c" stroke-width="1.1"/>
  <text x="392" y="216" font-size="11" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">roomName = "301호"</text>
  <text x="392" y="234" font-size="11" fill="#b91c1c" font-family="ui-monospace, Consolas, monospace">confirmed = false</text>

  <text x="650" y="112" font-size="11" fill="#475569">값은 같지만 r1 ≠ r2 다.</text>
  <text x="650" y="132" font-size="11" fill="#475569">취소한 건 r2 뿐이라</text>
  <text x="650" y="152" font-size="11" fill="#475569">기존 예약 r1은 그대로다.</text>
  <text x="650" y="180" font-size="11" fill="#b91c1c">둘을 구분할 값이 없다</text>

  <line x1="30" y1="272" x2="830" y2="272" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 5"/>

  <!-- ================= 하단: 식별자 도입 후 ================= -->
  <text x="30" y="300" font-size="12.5" font-weight="600" fill="#0f172a">id로 취소한 뒤 — 인스턴스는 하나, 그런데 링크가 둘</text>

  <rect x="30" y="322" width="210" height="52" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="135" y="344" font-size="12" fill="#0f172a" text-anchor="middle" text-decoration="underline">store : ArrayList</text>
  <text x="135" y="363" font-size="11" fill="#b45309" text-anchor="middle">size = 2 (미검증)</text>

  <line x1="240" y1="336" x2="380" y2="352" stroke="#334155" stroke-width="1.2"/>
  <text x="300" y="330" font-size="10.5" fill="#475569" text-anchor="middle">[0]</text>
  <line x1="240" y1="360" x2="380" y2="376" stroke="#b45309" stroke-width="1.2"/>
  <text x="300" y="382" font-size="10.5" fill="#b45309" text-anchor="middle">[1]</text>

  <rect x="380" y="318" width="250" height="94" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="505" y="338" font-size="12" fill="#0f172a" text-anchor="middle" text-decoration="underline">r1 : Reservation</text>
  <line x1="380" y1="346" x2="630" y2="346" stroke="#334155" stroke-width="1.1"/>
  <text x="392" y="364" font-size="11" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">id = 1</text>
  <text x="392" y="382" font-size="11" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">roomName = "301호"</text>
  <text x="392" y="400" font-size="11" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">confirmed = false</text>

  <text x="650" y="352" font-size="11" fill="#475569">id로 찾았으니 상태 변경은</text>
  <text x="650" y="372" font-size="11" fill="#475569">저장돼 있던 그 객체에 났다.</text>
  <text x="650" y="400" font-size="11" fill="#b45309">그런데 링크가 둘이다</text>

  <!-- note -->
  <line x1="300" y1="412" x2="300" y2="440" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <path d="M 30 440 L 786 440 L 800 454 L 800 512 L 30 512 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
  <path d="M 786 440 L 786 454 L 800 454" fill="none" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="42" y="462" font-size="11.5" fill="#0f172a">리스트에는 복사본이 아니라 참조가 들어간다. cancel()로 이미 바뀐 객체를 save()에 다시 넘겼는데,</text>
  <text x="42" y="482" font-size="11.5" fill="#0f172a">save()는 ID 유무와 무관하게 store.add()를 실행하므로 같은 인스턴스에 링크가 하나 더 생길 수 있다.</text>
  <text x="42" y="502" font-size="11.5" fill="#b45309">원소 수를 세는 테스트도 findAll() 엔드포인트도 없어서 실제로 그런지는 확인하지 않았다.</text>
</svg>
