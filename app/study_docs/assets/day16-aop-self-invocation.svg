<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 1010" width="930" height="1010" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="930" height="1010" fill="#ffffff"/>
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
    <style>
      .msg { stroke: #334155; stroke-width: 1.3; fill: none; marker-end: url(#call); }
      .rtn { stroke: #334155; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; marker-end: url(#ret); }
      .act { fill: #ffffff; stroke: #334155; stroke-width: 1.1; }
      .life { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; }
      .frame { fill: none; stroke: #334155; stroke-width: 1.2; }
      .tab { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .code { font-size: 11.5px; fill: #334155; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .txt { font-size: 11.5px; fill: #475569; }
      .result { font-size: 12px; font-weight: 700; fill: #0f172a; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .ftitle { font-size: 12px; font-weight: 600; fill: #0f172a; }
    </style>
  </defs>

  <text x="30" y="28" font-size="12" fill="#475569">시퀀스 다이어그램 — 호출 경로에 따른 inner()의 트랜잭션 활성 상태 (TransactionProxySelfInvocationTest)</text>

  <!-- participants -->
  <rect x="34" y="46" width="112" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="90" y="71" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">테스트</text>

  <rect x="250" y="46" width="180" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="340" y="64" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Spring AOP 프록시</text>
  <text x="340" y="79" class="code" text-anchor="middle">TransactionInterceptor</text>

  <rect x="540" y="46" width="200" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="640" y="64" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">SelfInvocationService</text>
  <text x="640" y="79" class="code" text-anchor="middle">target</text>

  <!-- lifelines -->
  <line x1="90"  y1="86" x2="90"  y2="972" class="life"/>
  <line x1="340" y1="86" x2="340" y2="972" class="life"/>
  <line x1="640" y1="86" x2="640" y2="972" class="life"/>

  <!-- ===== frame 1: external inner() ===== -->
  <rect x="46" y="104" width="864" height="256" class="frame"/>
  <path d="M 46 104 L 226 104 L 226 120 L 214 132 L 46 132 z" class="tab"/>
  <text x="58" y="123" class="ftitle">외부에서 inner() 호출</text>

  <rect x="336" y="146" width="8" height="198" class="act"/>
  <rect x="636" y="212" width="8" height="74" class="act"/>

  <line x1="90" y1="150" x2="334" y2="150" class="msg"/>
  <text x="212" y="144" class="code" text-anchor="middle">service.inner()</text>

  <path d="M 344 168 H 384 V 190 H 346" class="msg"/>
  <text x="392" y="183" class="txt">@Transactional 확인 → 트랜잭션 시작</text>

  <line x1="344" y1="216" x2="634" y2="216" class="msg"/>
  <text x="489" y="210" class="code" text-anchor="middle">inner()</text>

  <path d="M 644 234 H 684 V 256 H 646" class="msg"/>
  <text x="692" y="249" class="code">isActualTransactionActive()</text>

  <line x1="634" y1="282" x2="346" y2="282" class="rtn"/>
  <text x="489" y="276" class="code" text-anchor="middle">true</text>

  <path d="M 344 298 H 384 V 320 H 346" class="msg"/>
  <text x="392" y="313" class="txt">트랜잭션 종료</text>

  <line x1="334" y1="340" x2="92" y2="340" class="rtn"/>
  <text x="212" y="334" class="result" text-anchor="middle">active = true</text>

  <!-- ===== frame 2: non-transactional outer() ===== -->
  <rect x="46" y="380" width="864" height="266" class="frame"/>
  <path d="M 46 380 L 286 380 L 286 396 L 274 408 L 46 408 z" class="tab"/>
  <text x="58" y="399" class="ftitle">비트랜잭션 outer()의 내부 호출</text>

  <rect x="336" y="422" width="8" height="208" class="act"/>
  <rect x="636" y="488" width="8" height="118" class="act"/>
  <rect x="640" y="528" width="8" height="60" class="act"/>

  <line x1="90" y1="426" x2="334" y2="426" class="msg"/>
  <text x="212" y="420" class="code" text-anchor="middle">service.outer()</text>

  <path d="M 344 444 H 384 V 466 H 346" class="msg"/>
  <text x="392" y="459" class="txt">애노테이션 없음 → 그대로 위임</text>

  <line x1="344" y1="492" x2="634" y2="492" class="msg"/>
  <text x="489" y="486" class="code" text-anchor="middle">outer()</text>

  <path d="M 644 510 H 684 V 532 H 650" class="msg"/>
  <text x="692" y="519" class="code">this.inner()</text>
  <text x="692" y="535" class="txt">프록시 재진입 없음</text>

  <path d="M 648 554 H 688 V 576 H 650" class="msg"/>
  <text x="696" y="569" class="code">isActualTransactionActive()</text>

  <line x1="634" y1="602" x2="346" y2="602" class="rtn"/>
  <text x="489" y="596" class="code" text-anchor="middle">false</text>

  <line x1="334" y1="626" x2="92" y2="626" class="rtn"/>
  <text x="212" y="620" class="result" text-anchor="middle">active = false</text>

  <!-- ===== frame 3: transactional outer() ===== -->
  <rect x="46" y="666" width="864" height="296" class="frame"/>
  <path d="M 46 666 L 296 666 L 296 682 L 284 694 L 46 694 z" class="tab"/>
  <text x="58" y="685" class="ftitle">트랜잭션 outer()의 내부 호출</text>

  <rect x="336" y="708" width="8" height="238" class="act"/>
  <rect x="636" y="774" width="8" height="114" class="act"/>
  <rect x="640" y="814" width="8" height="56" class="act"/>

  <line x1="90" y1="712" x2="334" y2="712" class="msg"/>
  <text x="212" y="706" class="code" text-anchor="middle">service.transactionalOuter()</text>

  <path d="M 344 730 H 384 V 752 H 346" class="msg"/>
  <text x="392" y="745" class="txt">@Transactional 확인 → 트랜잭션 시작</text>

  <line x1="344" y1="778" x2="634" y2="778" class="msg"/>
  <text x="489" y="772" class="code" text-anchor="middle">transactionalOuter()</text>

  <path d="M 644 796 H 684 V 818 H 650" class="msg"/>
  <text x="692" y="805" class="code">this.inner()</text>
  <text x="692" y="821" class="txt">프록시 우회</text>

  <path d="M 648 840 H 688 V 862 H 650" class="msg"/>
  <text x="696" y="855" class="code">isActualTransactionActive()</text>

  <line x1="634" y1="884" x2="346" y2="884" class="rtn"/>
  <text x="489" y="878" class="code" text-anchor="middle">true</text>

  <path d="M 344 900 H 384 V 922 H 346" class="msg"/>
  <text x="392" y="915" class="txt">트랜잭션 종료</text>

  <line x1="334" y1="942" x2="92" y2="942" class="rtn"/>
  <text x="212" y="936" class="result" text-anchor="middle">active = true</text>

  <!-- footnote -->
  <text x="30" y="994" font-size="12" fill="#475569">세 번째 true는 inner()의 애노테이션이 적용된 결과가 아니라, 프록시가 바깥 경계에서 먼저 시작한 트랜잭션 안에 있다는 결과다.</text>
</svg>
