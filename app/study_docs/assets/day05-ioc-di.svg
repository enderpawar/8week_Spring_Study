<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="860" height="520" fill="#ffffff"/>
  <defs>
    <marker id="assoc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
    <marker id="realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 11 6 L 0 12 z" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
    </marker>
  </defs>

  <text x="30" y="28" font-size="12" fill="#475569">클래스 다이어그램 — 화살표가 구현체가 아니라 인터페이스를 향한다</text>

  <!-- Controller -->
  <rect x="30" y="46" width="290" height="58" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="175" y="68" font-size="11.5" fill="#475569" text-anchor="middle">«@RestController»</text>
  <text x="175" y="90" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">ReservationController</text>

  <line x1="175" y1="104" x2="175" y2="146" stroke="#334155" stroke-width="1.2" marker-end="url(#assoc)"/>
  <text x="186" y="122" font-size="11" fill="#475569">생성자 주입</text>
  <text x="186" y="140" font-size="11" fill="#475569">1</text>

  <!-- Service -->
  <rect x="30" y="150" width="330" height="120" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="195" y="172" font-size="11.5" fill="#475569" text-anchor="middle">«@Service»</text>
  <text x="195" y="194" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">ReservationService</text>
  <line x1="30" y1="204" x2="360" y2="204" stroke="#334155" stroke-width="1.1"/>
  <text x="42" y="224" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">- repository : ReservationRepository</text>
  <line x1="30" y1="234" x2="360" y2="234" stroke="#334155" stroke-width="1.1"/>
  <text x="42" y="254" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">+ ReservationService(ReservationRepository)</text>

  <line x1="195" y1="270" x2="195" y2="312" stroke="#334155" stroke-width="1.2" marker-end="url(#assoc)"/>
  <text x="206" y="288" font-size="11" fill="#475569">생성자 주입</text>
  <text x="206" y="306" font-size="11" fill="#475569">1</text>

  <!-- Interface -->
  <rect x="30" y="316" width="330" height="136" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="195" y="338" font-size="11.5" fill="#475569" text-anchor="middle">«interface»</text>
  <text x="195" y="360" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">ReservationRepository</text>
  <line x1="30" y1="370" x2="360" y2="370" stroke="#334155" stroke-width="1.1"/>
  <text x="42" y="390" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">+ save(Reservation) : Reservation</text>
  <text x="42" y="410" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">+ findById(Long) : Reservation</text>
  <text x="42" y="430" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">+ findAll() : List&lt;Reservation&gt;</text>

  <!-- realization -->
  <line x1="500" y1="384" x2="372" y2="384" stroke="#334155" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#realize)"/>
  <text x="436" y="376" font-size="11" fill="#475569" text-anchor="middle">«realize»</text>

  <!-- Impl -->
  <rect x="500" y="316" width="330" height="106" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="665" y="338" font-size="11.5" fill="#475569" text-anchor="middle">«@Repository»</text>
  <text x="665" y="360" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">InMemoryReservationRepository</text>
  <line x1="500" y1="370" x2="830" y2="370" stroke="#334155" stroke-width="1.1"/>
  <text x="512" y="390" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">- store : List&lt;Reservation&gt;</text>
  <text x="512" y="410" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">- nextId : Long</text>

  <!-- note: container -->
  <line x1="500" y1="200" x2="440" y2="200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <path d="M 440 132 L 816 132 L 830 146 L 830 268 L 440 268 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
  <path d="M 816 132 L 816 146 L 830 146" fill="none" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="452" y="154" font-size="11.5" font-weight="600" fill="#0f172a">ApplicationContext</text>
  <text x="452" y="176" font-size="11.5" fill="#0f172a">기동 시 각 «@…» Bean을 만들고 생성자 인자 타입에 맞는</text>
  <text x="452" y="196" font-size="11.5" fill="#0f172a">Bean을 찾아 넣는다. new를 부르는 쪽이 내가 아니다.</text>
  <text x="452" y="220" font-size="11.5" fill="#0f172a">기본 scope는 singleton — 두 번 꺼내도 같은 인스턴스라</text>
  <text x="452" y="240" font-size="11.5" fill="#0f172a">== 가 true다. 그래서 Service는 무상태여야 한다.</text>
  <text x="452" y="260" font-size="11.5" fill="#b91c1c">@Repository를 떼면 넣어줄 Bean이 없어 기동에서 실패한다.</text>

  <!-- note: DIP -->
  <line x1="195" y1="452" x2="195" y2="472" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <path d="M 30 472 L 806 472 L 820 486 L 820 512 L 30 512 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
  <path d="M 806 472 L 806 486 L 820 486" fill="none" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="42" y="496" font-size="11.5" fill="#0f172a">Service의 화살표가 InMemoryReservationRepository가 아니라 인터페이스로 간다. Service는 구현체 이름을 모른다.</text>
</svg>
