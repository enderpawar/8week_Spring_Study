<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="840" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <marker id="a5r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="19" font-weight="700" fill="#0f172a">생성자에 Repository를 넣어주는 건 누구인가</text>
  <text x="40" y="54" font-size="13" fill="#64748b">내가 new 하지 않는데도 객체가 연결돼 있다. 조립 책임이 컨테이너로 넘어갔다.</text>

  <!-- container -->
  <rect x="30" y="78" width="500" height="330" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="50" y="104" font-size="15" font-weight="700" fill="#3730a3">ApplicationContext (Spring 컨테이너)</text>
  <text x="50" y="124" font-size="12" fill="#64748b">애플리케이션이 뜰 때 Bean을 만들고 서로 연결한다</text>

  <rect x="52" y="140" width="456" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="70" y="163" font-size="13" font-weight="600" fill="#0f172a">@RestController  ReservationController</text>
  <text x="70" y="184" font-size="12" fill="#475569" font-family="ui-monospace, Consolas, monospace">ReservationController(ReservationService s)</text>
  <text x="70" y="199" font-size="11" fill="#94a3b8">생성자가 필요한 것을 선언만 한다</text>

  <line x1="280" y1="206" x2="280" y2="232" stroke="#6366f1" stroke-width="1.8" marker-end="url(#a5)"/>
  <text x="292" y="225" font-size="11" fill="#6366f1">주입</text>

  <rect x="52" y="236" width="456" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="70" y="259" font-size="13" font-weight="600" fill="#0f172a">@Service  ReservationService</text>
  <text x="70" y="280" font-size="12" fill="#475569" font-family="ui-monospace, Consolas, monospace">ReservationService(ReservationRepository r)</text>
  <text x="70" y="295" font-size="11" fill="#94a3b8">구현체 이름을 모른다 — 인터페이스만 안다</text>

  <line x1="280" y1="302" x2="280" y2="328" stroke="#6366f1" stroke-width="1.8" marker-end="url(#a5)"/>
  <text x="292" y="321" font-size="11" fill="#6366f1">주입</text>

  <rect x="52" y="332" width="456" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="70" y="355" font-size="13" font-weight="600" fill="#0f172a">@Repository  InMemoryReservationRepository</text>
  <text x="70" y="376" font-size="12" fill="#475569">인터페이스 ReservationRepository의 구현체</text>

  <!-- right: singleton -->
  <rect x="552" y="78" width="258" height="150" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="572" y="104" font-size="14" font-weight="700" fill="#0f172a">Bean은 기본이 싱글톤</text>
  <text x="572" y="128" font-size="12" fill="#475569" font-family="ui-monospace, Consolas, monospace">getBean(X.class)</text>
  <text x="572" y="146" font-size="12" fill="#475569" font-family="ui-monospace, Consolas, monospace">getBean(X.class)</text>
  <text x="572" y="170" font-size="12" fill="#166534">두 번 꺼내도 같은 인스턴스</text>
  <text x="572" y="190" font-size="13" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">a == b  →  true</text>
  <text x="572" y="214" font-size="11" fill="#64748b">참조 비교인데도 true인 이유가 이것</text>

  <!-- right: no bean -->
  <rect x="552" y="244" width="258" height="164" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="572" y="270" font-size="14" font-weight="700" fill="#0f172a">@Repository를 떼면</text>
  <text x="572" y="294" font-size="12" fill="#475569">컨테이너가 이 클래스를 Bean으로</text>
  <text x="572" y="312" font-size="12" fill="#475569">등록하지 않는다</text>
  <text x="572" y="336" font-size="12" fill="#475569">Service 생성자에 넣어줄 것이</text>
  <text x="572" y="354" font-size="12" fill="#475569">없으므로 조립 자체가 실패한다</text>
  <text x="572" y="380" font-size="12" fill="#b91c1c" font-weight="600">기동 시점에 터진다</text>
  <text x="572" y="398" font-size="11" fill="#dc2626" font-family="ui-monospace, Consolas, monospace">NoSuchBeanDefinition...</text>

  <!-- bottom: stateless -->
  <rect x="30" y="428" width="780" height="106" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="50" y="454" font-size="14" font-weight="700" fill="#b45309">싱글톤이라서 따라오는 제약 — Service는 무상태여야 한다</text>
  <text x="50" y="478" font-size="12" fill="#475569">인스턴스가 하나뿐이라 모든 요청이 같은 객체를 공유한다. 요청별 값을 필드에 두면</text>
  <text x="50" y="497" font-size="12" fill="#475569">동시에 들어온 요청끼리 서로의 값을 덮어쓸 수 있다. 요청별 데이터는 필드가 아니라 <tspan font-weight="600" fill="#0f172a">파라미터</tspan>로 넘긴다.</text>
  <text x="50" y="521" font-size="12" fill="#94a3b8">Day5에서 경쟁 상태를 실제로 재현하지는 않았다. 구조상 가능하다는 것까지만 확인했다.</text>
</svg>
