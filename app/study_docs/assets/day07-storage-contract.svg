<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 720" width="930" height="720" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="930" height="720" fill="#ffffff"/>
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
    <marker id="callErr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="retErr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#b91c1c" stroke-width="1.2"/>
    </marker>
    <style>
      .msg { stroke: #334155; stroke-width: 1.3; fill: none; marker-end: url(#call); }
      .rtn { stroke: #334155; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; marker-end: url(#ret); }
      .emsg { stroke: #b91c1c; stroke-width: 1.3; fill: none; marker-end: url(#callErr); }
      .ertn { stroke: #b91c1c; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; marker-end: url(#retErr); }
      .act { fill: #ffffff; stroke: #334155; stroke-width: 1.1; }
      .life { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; }
      .frame { fill: none; stroke: #334155; stroke-width: 1.2; }
      .tab { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .code { font-size: 11.5px; fill: #334155; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .ecode { font-size: 11.5px; fill: #b91c1c; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .etxt { font-size: 11.5px; fill: #b91c1c; }
      .ftitle { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .pname { font-size: 13px; font-weight: 600; fill: #0f172a; }
      .psub { font-size: 11px; fill: #334155; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
    </style>
  </defs>

  <text x="30" y="28" font-size="12" fill="#475569">시퀀스 다이어그램 — 취소 요청의 저장 계약과 값 부재 경계 (ReservationControllerHttpTest, commit 6c88dcb)</text>

  <!-- participants -->
  <rect x="8" y="46" width="124" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="70" y="63" class="pname" text-anchor="middle">MockMvc</text>
  <text x="70" y="79" class="psub" text-anchor="middle">DispatcherServlet</text>

  <rect x="150" y="46" width="160" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="230" y="63" class="pname" text-anchor="middle">Controller</text>
  <text x="230" y="79" class="psub" text-anchor="middle">ReservationController</text>

  <rect x="400" y="46" width="140" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="470" y="63" class="pname" text-anchor="middle">Service</text>
  <text x="470" y="79" class="psub" text-anchor="middle">ReservationService</text>

  <rect x="562" y="46" width="216" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="670" y="63" class="pname" text-anchor="middle">Repository</text>
  <text x="670" y="79" class="psub" text-anchor="middle">InMemoryReservationRepository</text>

  <rect x="782" y="46" width="146" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="855" y="63" class="pname" text-anchor="middle">예외 처리기</text>
  <text x="855" y="79" font-size="10.5" fill="#334155" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" text-anchor="middle">GlobalExceptionHandler</text>

  <!-- lifelines -->
  <line x1="70"  y1="86" x2="70"  y2="704" class="life"/>
  <line x1="230" y1="86" x2="230" y2="704" class="life"/>
  <line x1="470" y1="86" x2="470" y2="704" class="life"/>
  <line x1="670" y1="86" x2="670" y2="704" class="life"/>
  <line x1="855" y1="86" x2="855" y2="704" class="life"/>

  <!-- activations -->
  <rect x="226" y="112" width="8" height="504" class="act"/>
  <rect x="466" y="142" width="8" height="446" class="act"/>
  <rect x="666" y="172" width="8" height="76" class="act"/>
  <rect x="666" y="312" width="8" height="82" class="act"/>
  <rect x="851" y="636" width="8" height="36" class="act"/>

  <!-- common prefix -->
  <line x1="70" y1="116" x2="224" y2="116" class="msg"/>
  <text x="150" y="110" class="code" text-anchor="middle">POST …/cancel/{id}</text>

  <line x1="234" y1="146" x2="464" y2="146" class="msg"/>
  <text x="350" y="140" class="code" text-anchor="middle">cancel(id)</text>

  <line x1="474" y1="176" x2="664" y2="176" class="msg"/>
  <text x="570" y="170" class="code" text-anchor="middle">findById(id)</text>

  <!-- alt frame -->
  <rect x="24" y="196" width="896" height="492" class="frame"/>
  <path d="M 24 196 L 84 196 L 84 212 L 74 224 L 24 224 z" class="tab"/>
  <text x="40" y="215" class="ftitle">alt</text>
  <text x="100" y="216" class="ftitle">[id가 저장소에 있음]</text>

  <!-- operand 1 -->
  <line x1="664" y1="244" x2="476" y2="244" class="rtn"/>
  <text x="570" y="238" class="code" text-anchor="middle">Optional.of(r)</text>

  <path d="M 474 266 L 504 266 L 504 288 L 476 288" class="msg"/>
  <text x="512" y="282" class="code">r.cancel()</text>

  <line x1="474" y1="316" x2="664" y2="316" class="msg"/>
  <text x="570" y="310" class="code" text-anchor="middle">save(r)</text>

  <path d="M 674 340 L 704 340 L 704 362 L 676 362" class="msg"/>
  <text x="712" y="356" class="code">store.set(index, r)</text>

  <line x1="664" y1="390" x2="476" y2="390" class="rtn"/>
  <text x="570" y="384" class="code" text-anchor="middle">r</text>

  <line x1="464" y1="416" x2="236" y2="416" class="rtn"/>
  <text x="350" y="410" class="code" text-anchor="middle">r</text>

  <line x1="224" y1="442" x2="72" y2="442" class="rtn"/>
  <text x="150" y="436" class="code" text-anchor="middle">200 OK</text>

  <!-- divider -->
  <line x1="24" y1="462" x2="920" y2="462" stroke="#334155" stroke-width="1.1" stroke-dasharray="6 4"/>
  <text x="100" y="484" class="ftitle">[id가 저장소에 없음]</text>

  <!-- operand 2 -->
  <line x1="670" y1="510" x2="476" y2="510" class="ertn"/>
  <text x="570" y="504" class="ecode" text-anchor="middle">Optional.empty()</text>

  <path d="M 474 532 L 504 532 L 504 554 L 476 554" class="emsg"/>
  <text x="512" y="548" class="ecode">orElseThrow()</text>

  <line x1="464" y1="584" x2="236" y2="584" class="ertn"/>
  <text x="350" y="578" class="ecode" text-anchor="middle">ReservationNotFoundException</text>

  <line x1="224" y1="610" x2="72" y2="610" class="ertn"/>
  <text x="150" y="604" class="etxt" text-anchor="middle">예외 전파</text>

  <line x1="70" y1="640" x2="849" y2="640" class="emsg"/>
  <text x="570" y="634" class="ecode" text-anchor="middle">handleNotFound(ex)</text>

  <line x1="849" y1="668" x2="72" y2="668" class="ertn"/>
  <text x="570" y="662" class="ecode" text-anchor="middle">404 {"error": …}</text>
</svg>
