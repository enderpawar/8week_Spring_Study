<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 650" width="930" height="650" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="930" height="650" fill="#ffffff"/>
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
    <marker id="callErr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="retErr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#b91c1c" stroke-width="1.2"/>
    </marker>
    <style>
      .msg { stroke: #334155; stroke-width: 1.3; fill: none; marker-end: url(#call); }
      .rtn { stroke: #334155; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; marker-end: url(#ret); }
      .msgErr { stroke: #b91c1c; stroke-width: 1.3; fill: none; marker-end: url(#callErr); }
      .rtnErr { stroke: #b91c1c; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; marker-end: url(#retErr); }
      .act { fill: #ffffff; stroke: #334155; stroke-width: 1.1; }
      .life { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; }
      .frame { fill: none; stroke: #334155; stroke-width: 1.2; }
      .tab { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .code { font-size: 11.5px; fill: #334155; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .codeErr { font-size: 11px; fill: #b91c1c; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .txt { font-size: 11.5px; fill: #475569; }
      .txtErr { font-size: 11.5px; fill: #b91c1c; }
      .pname { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .stereo { font-size: 10.5px; fill: #475569; }
    </style>
  </defs>

  <text x="20" y="28" font-size="12" fill="#475569">시퀀스 다이어그램 — 컨텍스트 기동 시 생성자 주입으로 Bean을 조립하는 순서와 @Repository 제거 시 실패 지점</text>

  <!-- participants -->
  <rect x="15" y="46" width="100" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="65" y="71" class="pname" text-anchor="middle">테스트 실행</text>

  <rect x="205" y="46" width="170" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="290" y="71" class="pname" text-anchor="middle">ApplicationContext</text>

  <rect x="385" y="46" width="210" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="490" y="61" class="stereo" text-anchor="middle">«@Repository»</text>
  <text x="490" y="78" class="pname" text-anchor="middle">InMemoryReservationRepository</text>

  <rect x="610" y="46" width="144" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="682" y="61" class="stereo" text-anchor="middle">«@Service»</text>
  <text x="682" y="78" class="pname" text-anchor="middle">ReservationService</text>

  <rect x="766" y="46" width="158" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="845" y="61" class="stereo" text-anchor="middle">«@RestController»</text>
  <text x="845" y="78" class="pname" text-anchor="middle">ReservationController</text>

  <!-- lifelines -->
  <line x1="65"  y1="86" x2="65"  y2="600" class="life"/>
  <line x1="290" y1="86" x2="290" y2="600" class="life"/>
  <line x1="490" y1="86" x2="490" y2="600" class="life"/>
  <line x1="682" y1="86" x2="682" y2="600" class="life"/>
  <line x1="845" y1="86" x2="845" y2="600" class="life"/>

  <!-- compile step -->
  <path d="M 69 110 H 105 V 130 H 71" class="msg"/>
  <text x="113" y="124" class="code">compileJava</text>
  <text x="200" y="124" class="txt">성공</text>

  <!-- context start -->
  <rect x="286" y="156" width="8" height="410" class="act"/>
  <line x1="65" y1="160" x2="284" y2="160" class="msg"/>
  <text x="175" y="154" class="code" text-anchor="middle">contextLoads()</text>

  <path d="M 294 176 H 330 V 196 H 296" class="msg"/>
  <text x="338" y="190" class="txt">Component Scan</text>

  <path d="M 294 212 H 330 V 232 H 296" class="msg"/>
  <text x="338" y="226" class="txt">생성자 인자 후보 탐색</text>

  <!-- alt frame -->
  <rect x="25" y="250" width="880" height="336" class="frame"/>
  <path d="M 25 250 L 75 250 L 75 262 L 67 272 L 25 272 z" class="tab"/>
  <text x="36" y="266" font-size="12" font-weight="600" fill="#0f172a">alt</text>
  <text x="85" y="266" class="code">[@Repository 있음]</text>

  <!-- branch 1 -->
  <rect x="486" y="292" width="8" height="28" class="act"/>
  <line x1="294" y1="296" x2="484" y2="296" class="msg"/>
  <text x="390" y="290" class="txt" text-anchor="middle">① 생성</text>
  <line x1="486" y1="316" x2="296" y2="316" class="rtn"/>
  <text x="390" y="310" class="code" text-anchor="middle">repository</text>

  <rect x="678" y="342" width="8" height="28" class="act"/>
  <line x1="294" y1="346" x2="676" y2="346" class="msg"/>
  <text x="586" y="340" class="txt" text-anchor="middle">② <tspan class="code">(repository)</tspan> 주입</text>
  <line x1="678" y1="366" x2="296" y2="366" class="rtn"/>
  <text x="586" y="360" class="code" text-anchor="middle">service</text>

  <rect x="841" y="392" width="8" height="28" class="act"/>
  <line x1="294" y1="396" x2="839" y2="396" class="msg"/>
  <text x="763" y="390" class="txt" text-anchor="middle">③ <tspan class="code">(service)</tspan> 주입</text>
  <line x1="841" y1="416" x2="296" y2="416" class="rtn"/>
  <text x="763" y="410" class="code" text-anchor="middle">controller</text>

  <line x1="286" y1="446" x2="67" y2="446" class="rtn"/>
  <text x="177" y="440" class="txt" text-anchor="middle">기동 성공 · <tspan class="code">BUILD SUCCESSFUL</tspan></text>

  <!-- divider -->
  <line x1="25" y1="468" x2="905" y2="468" stroke="#334155" stroke-width="1.1" stroke-dasharray="6 4"/>
  <text x="85" y="486" class="code">[@Repository 제거]</text>

  <!-- branch 2 -->
  <path d="M 294 504 H 330 V 524 H 296" class="msgErr"/>
  <text x="338" y="518" class="txtErr">후보 Bean 없음</text>

  <line x1="286" y1="552" x2="67" y2="552" class="rtnErr"/>
  <text x="177" y="546" class="codeErr" text-anchor="middle">NoSuchBeanDefinitionException</text>
  <text x="177" y="570" class="txtErr" text-anchor="middle">contextLoads() 실패</text>

  <!-- footnote -->
  <text x="20" y="630" font-size="12" fill="#475569">두 경우 모두 compileJava는 성공했다. implements 관계는 남아 있고, 사라진 것은 Bean 등록이다.</text>
</svg>
