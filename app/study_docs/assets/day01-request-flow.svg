<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="820" height="420" fill="#ffffff"/>
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- participants -->
  <rect x="20" y="18" width="130" height="34" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="85" y="40" font-size="12" fill="#0f172a" text-anchor="middle">:클라이언트</text>
  <rect x="196" y="18" width="168" height="34" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="280" y="40" font-size="12" fill="#0f172a" text-anchor="middle">:DispatcherServlet</text>
  <rect x="400" y="18" width="150" height="34" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="475" y="40" font-size="12" fill="#0f172a" text-anchor="middle">:HandlerMapping</text>
  <rect x="592" y="18" width="156" height="34" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="670" y="40" font-size="12" fill="#0f172a" text-anchor="middle">:HelloController</text>

  <!-- lifelines -->
  <line x1="85" y1="52" x2="85" y2="400" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="280" y1="52" x2="280" y2="400" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="475" y1="52" x2="475" y2="400" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="670" y1="52" x2="670" y2="400" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- activations -->
  <rect x="274" y="78" width="12" height="300" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>
  <rect x="469" y="112" width="12" height="28" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>
  <rect x="664" y="212" width="12" height="34" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>

  <!-- m1 -->
  <line x1="85" y1="78" x2="268" y2="78" stroke="#334155" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="176" y="72" font-size="11" fill="#0f172a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">GET /hello</text>

  <!-- m2 -->
  <line x1="286" y1="112" x2="463" y2="112" stroke="#334155" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="374" y="106" font-size="11" fill="#0f172a" text-anchor="middle">경로·메서드로 핸들러 조회</text>

  <!-- alt frame -->
  <rect x="40" y="152" width="730" height="226" fill="none" stroke="#64748b" stroke-width="1.1"/>
  <path d="M 40 152 L 96 152 L 96 168 L 84 176 L 40 176 Z" fill="#f8fafc" stroke="#64748b" stroke-width="1.1"/>
  <text x="56" y="167" font-size="11" font-weight="600" fill="#0f172a">alt</text>
  <text x="106" y="167" font-size="11" fill="#0f172a">[매칭되는 핸들러 있음]</text>

  <!-- branch 1 -->
  <line x1="463" y1="196" x2="292" y2="196" stroke="#334155" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#ret)"/>
  <text x="378" y="190" font-size="11" fill="#0f172a" font-family="ui-monospace, Consolas, monospace" text-anchor="middle">hello()</text>

  <line x1="286" y1="228" x2="658" y2="228" stroke="#334155" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="472" y="222" font-size="11" fill="#0f172a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">hello()</text>

  <line x1="658" y1="260" x2="292" y2="260" stroke="#334155" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#ret)"/>
  <text x="472" y="254" font-size="11" fill="#0f172a" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">"Hello, StudyRoom!"</text>

  <line x1="268" y1="292" x2="91" y2="292" stroke="#334155" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#ret)"/>
  <text x="180" y="286" font-size="11" fill="#0f172a" text-anchor="middle">200 OK + 본문</text>
  <text x="180" y="306" font-size="10" fill="#64748b" text-anchor="middle">상태를 지정하지 않아 기본값</text>

  <!-- divider -->
  <line x1="40" y1="322" x2="770" y2="322" stroke="#64748b" stroke-width="1.1" stroke-dasharray="7 5"/>
  <text x="52" y="338" font-size="11" fill="#b91c1c">[없음]</text>

  <!-- branch 2 -->
  <line x1="463" y1="352" x2="292" y2="352" stroke="#b91c1c" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#ret)"/>
  <text x="378" y="346" font-size="11" fill="#b91c1c" text-anchor="middle">핸들러 없음</text>

  <line x1="268" y1="372" x2="91" y2="372" stroke="#b91c1c" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#ret)"/>
  <text x="180" y="366" font-size="11" fill="#b91c1c" text-anchor="middle">404 Not Found</text>
</svg>
