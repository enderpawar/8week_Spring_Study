<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 870" width="980" height="870" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="980" height="870" fill="#ffffff"/>
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
    <marker id="callErr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .msg { stroke: #334155; stroke-width: 1.3; fill: none; marker-end: url(#call); }
      .rtn { stroke: #334155; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; marker-end: url(#ret); }
      .err { stroke: #b91c1c; stroke-width: 1.3; fill: none; marker-end: url(#callErr); }
      .act { fill: #ffffff; stroke: #334155; stroke-width: 1.1; }
      .life { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; }
      .frame { fill: none; stroke: #334155; stroke-width: 1.2; }
      .tab { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .code { font-size: 11.5px; fill: #334155; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .txt { font-size: 11.5px; fill: #475569; }
      .result { font-size: 12px; font-weight: 700; fill: #0f172a; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .ftitle { font-size: 12px; font-weight: 600; fill: #0f172a; }
    </style>
  </defs>

  <text x="30" y="28" font-size="12" fill="#475569">시퀀스 다이어그램 — reserveThenFail() 예외 시 REQUIRED와 REQUIRES_NEW의 커밋·롤백 범위 차이 (TransactionPropagationTest)</text>

  <!-- participants -->
  <rect x="34" y="46" width="112" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="90" y="71" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">테스트</text>

  <rect x="250" y="46" width="220" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="360" y="64" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">PropagationOuterService</text>
  <text x="360" y="79" class="code" text-anchor="middle">(Proxy)</text>

  <rect x="560" y="46" width="220" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="670" y="64" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">PropagationInnerService</text>
  <text x="670" y="79" class="code" text-anchor="middle">(Proxy)</text>

  <!-- lifelines -->
  <line x1="90"  y1="86" x2="90"  y2="838" class="life"/>
  <line x1="360" y1="86" x2="360" y2="838" class="life"/>
  <line x1="670" y1="86" x2="670" y2="838" class="life"/>

  <!-- ===== frame 1: REQUIRED ===== -->
  <rect x="46" y="104" width="884" height="310" class="frame"/>
  <path d="M 46 104 L 340 104 L 340 120 L 328 132 L 46 132 z" class="tab"/>
  <text x="58" y="123" class="ftitle">REQUIRED — 이미 진행 중인 트랜잭션에 합류</text>

  <rect x="356" y="146" width="8" height="234" class="act"/>
  <rect x="666" y="212" width="8" height="74" class="act"/>

  <line x1="90" y1="150" x2="354" y2="150" class="msg"/>
  <text x="222" y="144" class="code" text-anchor="middle">reserveThenFail("D-101","진우")</text>

  <path d="M 364 168 H 404 V 190 H 366" class="msg"/>
  <text x="412" y="183" class="txt">@Transactional 확인 → 트랜잭션 A 시작</text>

  <line x1="364" y1="216" x2="664" y2="216" class="msg"/>
  <text x="514" y="210" class="code" text-anchor="middle">reserve("D-101","진우")</text>

  <path d="M 674 234 H 714 V 256 H 676" class="msg"/>
  <text x="722" y="249" class="txt">REQUIRED → 합류, INSERT는 Tx A 안</text>

  <line x1="664" y1="282" x2="366" y2="282" class="rtn"/>
  <text x="514" y="276" class="code" text-anchor="middle">Reservation</text>

  <path d="M 364 298 H 404 V 320 H 366" class="err"/>
  <text x="412" y="313" class="txt">RuntimeException 발생</text>

  <path d="M 364 336 H 404 V 358 H 366" class="err"/>
  <text x="412" y="351" class="txt">Tx A 전체 rollback (INSERT 포함)</text>

  <line x1="354" y1="380" x2="92" y2="380" class="rtn"/>
  <text x="222" y="374" class="code" text-anchor="middle">RuntimeException</text>

  <text x="58" y="404" class="result">결과 — reservationRepository에 "D-101" 없음</text>

  <!-- ===== frame 2: REQUIRES_NEW ===== -->
  <rect x="46" y="434" width="884" height="390" class="frame"/>
  <path d="M 46 434 L 360 434 L 360 450 L 348 462 L 46 462 z" class="tab"/>
  <text x="58" y="453" class="ftitle">REQUIRES_NEW — 독립된 트랜잭션으로 분리</text>

  <rect x="356" y="476" width="8" height="312" class="act"/>
  <rect x="666" y="542" width="8" height="146" class="act"/>

  <line x1="90" y1="480" x2="354" y2="480" class="msg"/>
  <text x="222" y="474" class="code" text-anchor="middle">reserveThenFail("D-101","진우")</text>

  <path d="M 364 498 H 404 V 520 H 366" class="msg"/>
  <text x="412" y="513" class="txt">@Transactional 확인 → 트랜잭션 A 시작</text>

  <line x1="364" y1="546" x2="664" y2="546" class="msg"/>
  <text x="514" y="540" class="code" text-anchor="middle">reserve("D-101","진우")</text>

  <path d="M 674 564 H 714 V 586 H 676" class="msg"/>
  <text x="722" y="579" class="txt">REQUIRES_NEW → A 보류, 새 Tx B 시작</text>
  <text x="722" y="592" class="txt">(동시에 커넥션 2개 필요)</text>

  <path d="M 674 602 H 714 V 624 H 676" class="msg"/>
  <text x="722" y="617" class="txt">INSERT 후 Tx B commit</text>

  <path d="M 674 640 H 714 V 662 H 676" class="msg"/>
  <text x="722" y="655" class="txt">Tx B 종료 → Tx A 재개</text>

  <line x1="664" y1="688" x2="366" y2="688" class="rtn"/>
  <text x="514" y="682" class="code" text-anchor="middle">Reservation</text>

  <path d="M 364 706 H 404 V 728 H 366" class="err"/>
  <text x="412" y="721" class="txt">RuntimeException 발생</text>

  <path d="M 364 744 H 404 V 766 H 366" class="err"/>
  <text x="412" y="759" class="txt">Tx A만 rollback (B는 이미 커밋되어 무관)</text>

  <line x1="354" y1="788" x2="92" y2="788" class="rtn"/>
  <text x="222" y="782" class="code" text-anchor="middle">RuntimeException</text>

  <text x="58" y="812" class="result">결과 — reservationRepository에 "D-101" 남음</text>

  <!-- footnote -->
  <text x="30" y="852" font-size="12" fill="#475569">REQUIRES_NEW은 커밋된 Tx B를 outer 롤백이 되돌리지 못하지만, 실행 중 커넥션 2개가 동시에 필요해 풀이 고갈되면 병목·교착 위험이 있다.</text>
</svg>
