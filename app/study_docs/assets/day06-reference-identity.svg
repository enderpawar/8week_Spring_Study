<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="900" height="650" fill="#ffffff"/>
  <defs>
    <style>
      .obj { fill: #ffffff; stroke: #334155; stroke-width: 1.3; }
      .sep { stroke: #334155; stroke-width: 1.1; }
      .link { stroke: #334155; stroke-width: 1.2; fill: none; }
      .oname { font-size: 12px; fill: #0f172a; text-decoration: underline; }
      .attr { font-size: 11px; fill: #0f172a; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .role { font-size: 10.5px; fill: #475569; }
      .code { font-size: 11.5px; fill: #334155; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .warn { font-size: 11.5px; fill: #b91c1c; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .band { font-size: 12.5px; font-weight: 600; fill: #0f172a; }
      .rule { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <text x="30" y="28" font-size="12" fill="#475569">객체 다이어그램 — 비교 시점의 인스턴스와 링크 (Week A 누적시험의 Singleton Bean과 Long 식별자)</text>

  <!-- ===== Band 1: Singleton Bean ===== -->
  <text x="30" y="62" class="band">① Singleton Bean — 같은 ApplicationContext에서 두 번 조회</text>

  <rect x="40" y="82" width="290" height="40" class="obj"/>
  <text x="185" y="107" class="oname" text-anchor="middle">test : StudyRoomApiApplicationTests</text>

  <rect x="40" y="160" width="290" height="40" class="obj"/>
  <text x="185" y="185" class="oname" text-anchor="middle">applicationContext : ApplicationContext</text>

  <rect x="500" y="112" width="300" height="44" class="obj"/>
  <text x="650" y="139" class="oname" text-anchor="middle">reservationService : ReservationService</text>

  <line x1="330" y1="94" x2="500" y2="122" class="link"/>
  <text x="455" y="104" class="role" text-anchor="middle">first</text>
  <line x1="330" y1="110" x2="500" y2="134" class="link"/>
  <text x="455" y="144" class="role" text-anchor="middle">second</text>
  <line x1="330" y1="180" x2="500" y2="148" class="link"/>
  <text x="410" y="184" class="role" text-anchor="middle">관리 (singleton)</text>

  <text x="500" y="186" class="code">first == second → true</text>
  <text x="500" y="204" class="code">assertSame(first, second) 통과</text>

  <line x1="30" y1="226" x2="870" y2="226" class="rule"/>

  <!-- ===== Band 2: Long 1000 ===== -->
  <text x="30" y="254" class="band">② Long 식별자 1000 — findById()의 값 비교, 인스턴스가 둘인 경우</text>

  <rect x="40" y="276" width="200" height="40" class="obj"/>
  <text x="140" y="301" class="oname" text-anchor="middle">r : Reservation</text>

  <rect x="40" y="346" width="250" height="40" class="obj"/>
  <text x="165" y="371" class="oname" text-anchor="middle">: InMemoryReservationRepository</text>

  <rect x="400" y="272" width="200" height="54" class="obj"/>
  <text x="500" y="291" class="oname" text-anchor="middle">storedId : Long</text>
  <line x1="400" y1="298" x2="600" y2="298" class="sep"/>
  <text x="412" y="316" class="attr">value = 1000</text>

  <rect x="400" y="340" width="200" height="54" class="obj"/>
  <text x="500" y="359" class="oname" text-anchor="middle">requestedId : Long</text>
  <line x1="400" y1="366" x2="600" y2="366" class="sep"/>
  <text x="412" y="384" class="attr">value = 1000</text>

  <line x1="240" y1="298" x2="400" y2="298" class="link"/>
  <text x="320" y="291" class="role" text-anchor="middle">id</text>
  <line x1="290" y1="366" x2="400" y2="366" class="link"/>
  <text x="345" y="359" class="role" text-anchor="middle">«parameter» id</text>

  <text x="630" y="316" class="warn">storedId == requestedId</text>
  <text x="630" y="334" class="warn">  → true 보장 없음</text>
  <text x="630" y="362" class="code">storedId.equals(requestedId)</text>
  <text x="630" y="380" class="code">  → true</text>

  <line x1="30" y1="418" x2="870" y2="418" class="rule"/>

  <!-- ===== Band 3: Long 1 (cache range) ===== -->
  <text x="30" y="446" class="band">③ Long 식별자 1 — Long.valueOf 캐시 범위(-128~127)</text>

  <rect x="40" y="468" width="200" height="40" class="obj"/>
  <text x="140" y="493" class="oname" text-anchor="middle">r : Reservation</text>

  <rect x="40" y="538" width="250" height="40" class="obj"/>
  <text x="165" y="563" class="oname" text-anchor="middle">: InMemoryReservationRepository</text>

  <rect x="400" y="496" width="200" height="54" class="obj"/>
  <text x="500" y="515" class="oname" text-anchor="middle">cached : Long</text>
  <line x1="400" y1="522" x2="600" y2="522" class="sep"/>
  <text x="412" y="540" class="attr">value = 1</text>

  <line x1="240" y1="490" x2="400" y2="510" class="link"/>
  <text x="320" y="490" class="role" text-anchor="middle">id</text>
  <line x1="290" y1="558" x2="400" y2="538" class="link"/>
  <text x="345" y="566" class="role" text-anchor="middle">«parameter» id</text>

  <text x="630" y="518" class="warn">storedId == requestedId</text>
  <text x="630" y="536" class="warn">  → 캐시로 true일 수 있음</text>

  <text x="30" y="624" font-size="11" fill="#475569">②③은 Long.valueOf 캐시 규칙에 따른 도식이며, 이번 시험에서 실행해 측정하지 않았다.</text>
</svg>
