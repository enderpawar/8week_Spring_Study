<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="860" height="500" fill="#ffffff"/>
  <defs>
    <marker id="dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Controller -->
  <rect x="290" y="24" width="290" height="62" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="435" y="46" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">ReservationController</text>
  <line x1="290" y1="56" x2="580" y2="56" stroke="#334155" stroke-width="1.1"/>
  <text x="302" y="75" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">+ reserve(ReservationRequest) : String</text>

  <!-- dependency arrows -->
  <line x1="360" y1="86" x2="250" y2="156" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#dep)"/>
  <text x="252" y="124" font-size="11" fill="#475569">«use»</text>
  <line x1="510" y1="86" x2="600" y2="156" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#dep)"/>
  <text x="566" y="124" font-size="11" fill="#475569">«create»</text>

  <!-- ReservationRequest -->
  <rect x="30" y="160" width="330" height="166" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="195" y="182" font-size="11.5" fill="#475569" text-anchor="middle">«record»</text>
  <text x="195" y="202" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">ReservationRequest</text>
  <line x1="30" y1="212" x2="360" y2="212" stroke="#334155" stroke-width="1.1"/>
  <text x="42" y="232" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">+ roomName : String {readOnly}</text>
  <text x="42" y="252" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">+ requesterName : String {readOnly}</text>
  <line x1="30" y1="264" x2="360" y2="264" stroke="#334155" stroke-width="1.1"/>
  <text x="42" y="284" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">+ roomName() : String</text>
  <text x="42" y="304" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">+ requesterName() : String</text>

  <!-- Reservation -->
  <rect x="470" y="160" width="360" height="226" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="650" y="184" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Reservation</text>
  <line x1="470" y1="194" x2="830" y2="194" stroke="#334155" stroke-width="1.1"/>
  <text x="482" y="214" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">- roomName : String {readOnly}</text>
  <text x="482" y="234" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">- requesterName : String {readOnly}</text>
  <text x="482" y="254" font-size="11.5" fill="#b91c1c" font-family="ui-monospace, Consolas, monospace">- confirmed : boolean</text>
  <line x1="470" y1="266" x2="830" y2="266" stroke="#334155" stroke-width="1.1"/>
  <text x="482" y="286" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">+ confirm() : void</text>
  <text x="482" y="306" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">+ canceled() : void</text>
  <text x="482" y="326" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">+ getRoomName() : String</text>
  <text x="482" y="346" font-size="11.5" fill="#0f172a" font-family="ui-monospace, Consolas, monospace">+ isConfirmed() : boolean</text>
  <text x="482" y="370" font-size="11" fill="#475569">{readOnly} = final</text>

  <!-- note on Reservation -->
  <line x1="650" y1="386" x2="650" y2="410" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <path d="M 470 410 L 816 410 L 830 424 L 830 480 L 470 480 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
  <path d="M 816 410 L 816 424 L 830 424" fill="none" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="482" y="432" font-size="11.5" fill="#0f172a">가변인 건 confirmed 하나뿐이고, 그마저 private이다.</text>
  <text x="482" y="452" font-size="11.5" fill="#0f172a">외부는 필드를 직접 못 바꾸고 confirm()·canceled()로만 바꾼다.</text>
  <text x="482" y="472" font-size="11.5" fill="#475569">이게 record와 class를 나눈 실제 이유다.</text>

  <!-- note on Request -->
  <line x1="195" y1="326" x2="195" y2="350" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <path d="M 30 350 L 346 350 L 360 364 L 360 412 L 30 412 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
  <path d="M 346 350 L 346 364 L 360 364" fill="none" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="42" y="372" font-size="11.5" fill="#0f172a">접근자 이름이 컴포넌트명 그대로다.</text>
  <text x="42" y="392" font-size="11.5" fill="#b91c1c" font-family="ui-monospace, Consolas, monospace">getRoomName() 은 생성되지 않는다</text>
</svg>
