<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="820" height="540" fill="#ffffff"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="19" font-weight="700" fill="#0f172a">DTO와 Domain을 나눈 자리</text>
  <text x="40" y="54" font-size="13" fill="#64748b">둘 다 같은 두 문자열을 담는다. 다른 건 담는 이유다.</text>

  <!-- JSON -->
  <rect x="40" y="78" width="400" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="102" font-size="15" font-weight="600" fill="#0f172a">요청 JSON 본문</text>
  <text x="60" y="123" font-size="12" fill="#475569" font-family="ui-monospace, Consolas, monospace">{"roomName":"301호","requesterName":"김민준"}</text>
  <line x1="240" y1="140" x2="240" y2="168" stroke="#64748b" stroke-width="1.8" marker-end="url(#a2)"/>

  <!-- boundary -->
  <line x1="30" y1="176" x2="790" y2="176" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="452" y="172" font-size="12" fill="#94a3b8">HTTP 경계 — @RequestBody가 여기서 변환한다</text>

  <!-- DTO -->
  <rect x="40" y="196" width="400" height="126" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="60" y="220" font-size="15" font-weight="600" fill="#0f172a">ReservationRequest — record</text>
  <text x="60" y="243" font-size="13" fill="#475569" font-family="ui-monospace, Consolas, monospace">roomName · requesterName</text>
  <text x="60" y="266" font-size="13" fill="#475569">컴포넌트는 다른 값으로 재할당할 수 없다</text>
  <text x="60" y="289" font-size="13" fill="#475569">접근자는 <tspan font-family="ui-monospace, Consolas, monospace" fill="#4338ca">roomName()</tspan></text>
  <text x="60" y="310" font-size="13" fill="#dc2626" font-family="ui-monospace, Consolas, monospace">getRoomName() 은 없다</text>

  <text x="470" y="222" font-size="13" font-weight="600" fill="#0f172a">역할: 나르기</text>
  <text x="470" y="243" font-size="12" fill="#64748b">외부가 보내는 데이터의 모양</text>
  <text x="470" y="262" font-size="12" fill="#64748b">API 입력 형식이 바뀌면</text>
  <text x="470" y="280" font-size="12" fill="#64748b">여기가 바뀐다</text>

  <line x1="240" y1="322" x2="240" y2="350" stroke="#64748b" stroke-width="1.8" marker-end="url(#a2)"/>
  <text x="252" y="342" font-size="12" fill="#64748b" font-family="ui-monospace, Consolas, monospace">new Reservation(request.roomName(), ...)</text>

  <!-- Domain -->
  <rect x="40" y="358" width="400" height="146" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="60" y="382" font-size="15" font-weight="600" fill="#0f172a">Reservation — class</text>
  <text x="60" y="405" font-size="13" fill="#475569" font-family="ui-monospace, Consolas, monospace">final roomName · final requesterName</text>
  <text x="60" y="428" font-size="13" fill="#475569" font-family="ui-monospace, Consolas, monospace">confirmed<tspan fill="#0f172a" font-family="system-ui, 'Malgun Gothic', sans-serif">  ← 이것만 가변</tspan></text>
  <text x="60" y="453" font-size="13" fill="#475569">외부에서 필드를 직접 못 바꾼다</text>
  <text x="60" y="474" font-size="13" fill="#166534" font-family="ui-monospace, Consolas, monospace">confirm() / canceled()</text>
  <text x="60" y="493" font-size="12" fill="#64748b">상태 변경은 이 메서드를 통해서만</text>

  <text x="470" y="384" font-size="13" font-weight="600" fill="#0f172a">역할: 상태 + 규칙</text>
  <text x="470" y="405" font-size="12" fill="#64748b">애플리케이션이 다루는 상태와</text>
  <text x="470" y="423" font-size="12" fill="#64748b">그 상태를 바꾸는 규칙</text>
  <text x="470" y="447" font-size="12" fill="#64748b">예약 규칙이 바뀌면</text>
  <text x="470" y="465" font-size="12" fill="#64748b">여기가 바뀐다</text>
  <text x="470" y="493" font-size="12" fill="#94a3b8">"가변"이 전부 가변은 아니다</text>
</svg>
