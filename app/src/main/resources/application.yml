spring:
  application:
    name: study-room-api
  datasource:
    url: jdbc:h2:file:./data/studyroom;MODE=MySQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate # Hibernate는 스키마를 건드리지 않는다. 주인은 Flyway.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

  flyway:
    enabled: true
# Week B에서 datasource(H2 → MySQL)와 JPA 설정을 여기에 추가한다.
